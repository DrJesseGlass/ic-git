# Pinned toolchain for reproducible canister builds (R1: verifiable backend).
#
# The wasm the IC runs is a deterministic function of this toolchain, the
# pinned dfx version (its bundled ic-wasm post-processes the module), and the
# committed Cargo.lock. Rebuild with these exact pins and you get a byte-
# identical wasm whose sha256 equals the module hash the IC reports for
# umobs-yiaaa-aaaab-agyrq-cai -- proving the running canister IS this source.
#
# The rust version here is itself embedded in the module's `icp:public dfx`
# metadata section, so changing it changes the module hash. Bump deliberately
# and re-attest. See REPRODUCIBLE_BUILD.md.
[toolchain]
channel = "1.94.1"
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
