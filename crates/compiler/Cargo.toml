[package]
name = "ic-git-compiler"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Builds .wat and .lang sources to wasm for ungoverned repos (docs/CANISTER_SPLIT.md, section 3). Pure: bytes in, wasm out."

[dependencies]
# Keep candid pinned to the version ic-dev-kit-rs uses (see canisters/combined).
candid = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = { version = "0.4", features = ["serde"] }

# Track B, rung R0 (see ROADMAP.md): on-chain WAT -> wasm assembler plus a
# validation pass. Both pure Rust, no filesystem/threads, target
# wasm32-unknown-unknown. wasmparser is already in-tree via wat/wast.
wat = "1"
wasmparser = "0.263"
# Track B, rung R1: emit wasm directly from our own compiler (no LLVM).
wasm-encoder = "0.263"
# Track B, rung R6: interpret a wasm32-wasip1 module (eventually rustc.wasm)
# held as data in stable memory. Pure Rust, builds to wasm32-unknown-unknown.
# Not 2.0: its instruction encoder (wasmi_ir::Op::encode) compiles into one
# function of complexity ~1.55M under this profile, past the IC's 1M limit
# (IC0505, "function complexity too high"), so the replica refuses to
# install the module at all. Checked 2026-11-13; CI does not install, so
# only the local e2e catches it. Bump again only after an install succeeds.
wasmi = "1"

[dev-dependencies]
serde_json = "1"
