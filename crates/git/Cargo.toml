[package]
name = "ic-git-git"
version = "0.1.0"
edition = "2021"
description = "ic-git's git side (docs/CANISTER_SPLIT.md, phase 2 step 4): objects, refs, repos, the smart-HTTP protocol, push tokens, site serving, the deploy configs and the proofs a deploy job carries. Knows nothing of the authority: what the authority decides reaches it through the mirrors."

[features]
# Test hooks for crates that test against this one: enabled only from
# dev-dependencies, so they never reach a wasm build.
testing = ["ic-git-common/testing"]

[dependencies]
# Keep these pinned to the versions ic-dev-kit-rs uses (see canisters/combined).
ic-dev-kit-rs = { version = "0.4", features = ["storage"] }
ic-cdk = "0.20"
# The outbox retry timer (outbox.rs).
ic-cdk-timers = "1"
candid = "0.10"
ic-stable-structures = "0.7"
# The approved set names commits by their ballot key (mirror.rs).
ic-multisig = { version = "0.2", features = ["candid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha1 = "0.10"
sha2 = "0.10"
hex = { version = "0.4", features = ["serde"] }
base64 = "0.22"
# Key-bound pushes (tokens.rs, signed_push.rs): verify the Ed25519 SSH
# signature on a git push certificate. Verification only: no default
# features, so no rand/getrandom and nothing that needs the OS.
ed25519-dalek = { version = "3", default-features = false }
ic-git-common = { path = "../common" }
ic-git-types = { path = "../types" }

[dev-dependencies]
ic-git-common = { path = "../common", features = ["testing"] }
# Drives the futures the interfaces answer with (side.rs), in tests.
futures = "0.3"
