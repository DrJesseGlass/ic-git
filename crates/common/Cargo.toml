[package]
name = "ic-git-common"
version = "0.1.0"
edition = "2021"
description = "What both sides of ic-git share while they are one canister (docs/CANISTER_SPLIT.md, phase 2 step 4): the stable-memory layout, the META map, the clock, the /api JSON helpers."

[features]
# Test hooks (a settable clock) for crates that test against this one:
# enabled only from dev-dependencies, so it never reaches a wasm build.
testing = []

[dependencies]
# Keep these pinned to the versions ic-dev-kit-rs uses (see canisters/combined).
ic-dev-kit-rs = { version = "0.4", features = ["storage"] }
ic-cdk = "0.20"
ic-stable-structures = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ic-git-types = { path = "../types" }
