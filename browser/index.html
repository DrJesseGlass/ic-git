<title>ic-git</title>
<!--
  ic-git repo browser. One file, no external resources: every byte that runs
  is inside the blob the ProvenanceRegistry attests, so a verifier that
  matches this file's hash has covered the whole app (VISION.md section 2,
  "SRI hashes"). Reads go to the canister's /api routes on the same origin,
  except the two ledger balances, which are anonymous queries to the IC HTTP
  API (docs/TENANCY.md, "Console").
-->
<style>

<body>
<header>
  <h1><a href="#/">ic-git</a></h1>

<main id="main"><p class="muted">loading&hellip;</p></main>
<script>
// === candid ===
// Minimal Candid, CBOR, and IC certificate handling for the console. Enough of
// each for the calls this page makes and the replies it reads; tested against
// encodings produced by the Rust candid crate (tools/console-codec-test.mjs).
const IC = (() => {
  'use strict';
  const te = new TextEncoder(), td = new TextDecoder();
  const big = v => typeof v === 'bigint' ? v : BigInt(v);
  function uleb(n) { n = big(n); const out = []; do { let b = Number(n & 0x7fn); n >>= 7n; if (n) b |= 0x80; out.push(b); } while (n); return out; }
  function sleb(n) { n = big(n); const out = []; for (;;) { const b = Number(n & 0x7fn); n >>= 7n; const sign = b & 0x40; if ((n === 0n && !sign) || (n === -1n && sign)) { out.push(b); return out; } out.push(b | 0x80); } }
  function idlHash(name) { let h = 0; for (const c of te.encode(name)) h = (Math.imul(h, 223) + c) >>> 0; return h; }
  const fieldId = n => /^[0-9]+$/.test(n) ? Number(n) : idlHash(n);
  const PRIM = { null: -1, bool: -2, nat: -3, int: -4, nat8: -5, nat16: -6, nat32: -7, nat64: -8, int8: -9, int16: -10, int32: -11, int64: -12, float32: -13, float64: -14, text: -15, reserved: -16, empty: -17, principal: -24 };

  // --- principals ---
  const CRC = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; } return t; })();
  function crc32(bytes) { let c = 0xffffffff; for (const b of bytes) c = CRC[(c ^ b) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
  const B32 = 'abcdefghijklmnopqrstuvwxyz234567';
  function b32enc(bytes) { let bits = 0, val = 0, out = ''; for (const b of bytes) { val = (val << 8) | b; bits += 8; while (bits >= 5) { out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; } } if (bits) out += B32[(val << (5 - bits)) & 31]; return out; }
  function b32dec(str) { let bits = 0, val = 0; const out = []; for (const ch of str) { const i = B32.indexOf(ch); if (i < 0) throw new Error('bad base32'); val = (val << 5) | i; bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } } return Uint8Array.from(out); }
  function principalToText(bytes) { const c = crc32(bytes); const all = new Uint8Array(4 + bytes.length); all.set([c >>> 24, (c >>> 16) & 255, (c >>> 8) & 255, c & 255]); all.set(bytes, 4); return b32enc(all).match(/.{1,5}/g).join('-'); }
  function principalFromText(text) { const raw = b32dec(text.toLowerCase().replace(/-/g, '')); const bytes = raw.slice(4); const c = crc32(bytes); if (((raw[0] << 24) | (raw[1] << 16) | (raw[2] << 8) | raw[3]) >>> 0 !== c) throw new Error('bad principal checksum'); return bytes; }

  // --- encoder ---
  // Types: a primitive name, 'blob', {opt: T}, {vec: T}, {record: {field: T}}, {variant: {tag: T}}.
  function encode(types, values) {
    const table = [], memo = new Map();
    function idx(t) {
      if (typeof t === 'string') { if (t === 'blob') return idx({ vec: 'nat8' }); if (!(t in PRIM)) throw new Error('unknown type ' + t); return PRIM[t]; }
      const key = JSON.stringify(t); if (memo.has(key)) return memo.get(key);
      const i = table.length; table.push(null); memo.set(key, i);
      let body;
      if (t.opt !== undefined) body = [...sleb(-18), ...sleb(idx(t.opt))];
      else if (t.vec !== undefined) body = [...sleb(-19), ...sleb(idx(t.vec))];
      else if (t.record || t.variant) {
        const fs = Object.entries(t.record || t.variant).map(([n, ft]) => [fieldId(n), idx(ft)]).sort((a, b) => a[0] - b[0]);
        body = [...sleb(t.record ? -20 : -21), ...uleb(fs.length)];
        for (const [id, ti] of fs) body.push(...uleb(id), ...sleb(ti));
      } else throw new Error('bad type');
      table[i] = body; return i;
    }
    function val(t, v, out) {
      if (t === 'blob') t = { vec: 'nat8' };
      if (typeof t === 'string') {
        switch (t) {
          case 'null': return;
          case 'bool': out.push(v ? 1 : 0); return;
          case 'nat': out.push(...uleb(v)); return;
          case 'int': out.push(...sleb(v)); return;
          case 'nat8': out.push(Number(v) & 255); return;
          case 'nat32': { const n = Number(v) >>> 0; out.push(n & 255, (n >>> 8) & 255, (n >>> 16) & 255, n >>> 24); return; }
          case 'nat64': { let n = big(v); for (let i = 0; i < 8; i++) { out.push(Number(n & 255n)); n >>= 8n; } return; }
          case 'text': { const b = te.encode(v); out.push(...uleb(b.length), ...b); return; }
          case 'principal': { const b = typeof v === 'string' ? principalFromText(v) : v; out.push(1, ...uleb(b.length), ...b); return; }
          default: throw new Error('cannot encode ' + t);
        }
      }
      if (t.opt !== undefined) { if (v === null || v === undefined) out.push(0); else { out.push(1); val(t.opt, v, out); } return; }
      if (t.vec !== undefined) { const arr = v instanceof Uint8Array ? Array.from(v) : v; out.push(...uleb(arr.length)); for (const x of arr) val(t.vec, x, out); return; }
      if (t.record) { for (const [n] of Object.entries(t.record).map(([n, ft]) => [n, ft]).sort((a, b) => fieldId(a[0]) - fieldId(b[0]))) val(t.record[n], v[n], out); return; }
      if (t.variant) { const names = Object.keys(t.variant).sort((a, b) => fieldId(a) - fieldId(b)); const tag = Object.keys(v)[0]; const i = names.indexOf(tag); if (i < 0) throw new Error('bad variant ' + tag); out.push(...uleb(i)); val(t.variant[tag], v[tag], out); return; }
      throw new Error('bad type');
    }
    const tis = types.map(idx);
    const out = [0x44, 0x49, 0x44, 0x4c, ...uleb(table.length)];
    for (const body of table) out.push(...body);
    out.push(...uleb(tis.length));
    for (const ti of tis) out.push(...sleb(ti));
    types.forEach((t, i) => val(t, values[i], out));
    return Uint8Array.from(out);
  }

  // --- decoder ---
  const NAMES = {}; for (const n of ['Ok', 'Err', 'Writer', 'Voter', 'principal', 'role', 'balance', 'deposited', 'spent', 'created_ns', 'canister_id', 'owner', 'subaccount', 'message', 'error_code', 'InsufficientFunds', 'InsufficientAllowance', 'GenericError', 'BadFee', 'expected_fee', 'allowance', 'TooOld', 'TemporarilyUnavailable', 'Duplicate', 'duplicate_of', 'CreatedInFuture', 'ledger_time', 'Expired', 'AllowanceChanged', 'current_allowance', 'BadBurn', 'min_burn_amount', 'target', 'source_path', 'mode', 'upgrade', 'reinstall', 'root', 'commit', 'ok', 'wasm_len', 'wasm_sha256', 'gas_limit', 'id', 'repo', 'minted_by', 'expires_ns', 'key', 'require_signed_push', 'tx_hash', 'nonce', 'from', 'contract_address', 'data', 'xdr_permyriad_per_icp', 'timestamp_seconds', 'certificate', 'hash_tree', 'block_index', 'who', 'e8s', 'at_ns', 'last_error']) NAMES[idlHash(n)] = n;
  function decode(bytes) {
    let pos = 0;
    const u8 = () => bytes[pos++];
    const rUleb = () => { let r = 0n, sh = 0n, b; do { b = u8(); r |= BigInt(b & 0x7f) << sh; sh += 7n; } while (b & 0x80); return r; };
    const rSleb = () => { let r = 0n, sh = 0n, b; do { b = u8(); r |= BigInt(b & 0x7f) << sh; sh += 7n; } while (b & 0x80); if (b & 0x40) r -= 1n << sh; return r; };
    if (td.decode(bytes.slice(0, 4)) !== 'DIDL') throw new Error('not candid'); pos = 4;
    const table = []; const n = Number(rUleb());
    for (let i = 0; i < n; i++) {
      const op = Number(rSleb());
      if (op === -18 || op === -19) table.push({ op, of: Number(rSleb()) });
      else if (op === -20 || op === -21) { const m = Number(rUleb()); const fields = []; for (let j = 0; j < m; j++) { const id = Number(rUleb()); fields.push({ id, t: Number(rSleb()) }); } table.push({ op, fields }); }
      else if (op === -22) { rUleb(); const a = Number(rUleb()); for (let j = 0; j < a; j++) rSleb(); const r = Number(rUleb()); for (let j = 0; j < r; j++) rSleb(); const ann = Number(rUleb()); pos += ann; table.push({ op }); }
      else throw new Error('unsupported type op ' + op);
    }
    const argc = Number(rUleb()); const types = []; for (let i = 0; i < argc; i++) types.push(Number(rSleb()));
    const name = id => NAMES[id] !== undefined ? NAMES[id] : (id < 256 ? String(id) : '_' + id);
    function value(t) {
      if (t < 0) switch (t) {
        case -1: return null;
        case -2: return u8() !== 0;
        case -3: return rUleb();
        case -4: return rSleb();
        case -5: return u8();
        case -6: return u8() | (u8() << 8);
        case -7: return (u8() | (u8() << 8) | (u8() << 16) | (u8() << 24)) >>> 0;
        case -8: { let r = 0n; for (let i = 0; i < 8; i++) r |= BigInt(u8()) << BigInt(8 * i); return r; }
        case -12: { let r = 0n; for (let i = 0; i < 8; i++) r |= BigInt(u8()) << BigInt(8 * i); return BigInt.asIntN(64, r); }
        case -15: { const l = Number(rUleb()); const s = td.decode(bytes.slice(pos, pos + l)); pos += l; return s; }
        case -16: return null;
        case -24: { if (u8() !== 1) throw new Error('opaque principal'); const l = Number(rUleb()); const b = bytes.slice(pos, pos + l); pos += l; return principalToText(b); }
        default: throw new Error('cannot decode type ' + t);
      }
      const e = table[t];
      if (e.op === -18) return u8() ? value(e.of) : null;
      if (e.op === -19) { const l = Number(rUleb()); if (e.of === -5) { const b = bytes.slice(pos, pos + l); pos += l; return b; } const a = []; for (let i = 0; i < l; i++) a.push(value(e.of)); return a; }
      if (e.op === -20) { const o = {}; for (const f of e.fields) o[name(f.id)] = value(f.t); return o; }
      if (e.op === -21) { const i = Number(rUleb()); const f = e.fields[i]; return { [name(f.id)]: value(f.t) }; }
      throw new Error('cannot decode');
    }
    return types.map(value);
  }

  // --- CBOR: decoder for certificates and content maps, encoder for query envelopes ---
  function cbor(bytes) {
    let pos = 0;
    function item() {
      const ib = bytes[pos++], mt = ib >> 5, ai = ib & 31;
      let n;
      if (ai < 24) n = ai; else if (ai === 24) n = bytes[pos++]; else if (ai === 25) { n = (bytes[pos] << 8) | bytes[pos + 1]; pos += 2; }
      else if (ai === 26) { n = ((bytes[pos] << 24) >>> 0) + ((bytes[pos + 1] << 16) | (bytes[pos + 2] << 8) | bytes[pos + 3]); pos += 4; }
      else if (ai === 27) { n = 0n; for (let i = 0; i < 8; i++) n = (n << 8n) | BigInt(bytes[pos++]); if (n <= BigInt(Number.MAX_SAFE_INTEGER)) n = Number(n); }
      else if (ai === 31) n = -1; else throw new Error('cbor: bad ai');
      switch (mt) {
        case 0: return n;
        case 1: return typeof n === 'bigint' ? -1n - n : -1 - n;
        case 2: { const b = bytes.slice(pos, pos + Number(n)); pos += Number(n); return b; }
        case 3: { const s = td.decode(bytes.slice(pos, pos + Number(n))); pos += Number(n); return s; }
        case 4: { const a = []; if (n === -1) { while (bytes[pos] !== 0xff) a.push(item()); pos++; } else for (let i = 0; i < Number(n); i++) a.push(item()); return a; }
        case 5: { const o = {}; const cnt = n === -1 ? Infinity : Number(n); for (let i = 0; i < cnt; i++) { if (n === -1 && bytes[pos] === 0xff) { pos++; break; } const k = item(); o[typeof k === 'string' ? k : String(k)] = item(); } return o; }
        case 6: return item();
        case 7: if (ai === 20) return false; if (ai === 21) return true; if (ai === 22 || ai === 23) return null; throw new Error('cbor: unsupported simple');
        default: throw new Error('cbor: bad major type');
      }
    }
    return item();
  }
  // CBOR encoder, for query envelopes: non-negative ints, text, bytes,
  // arrays and string-keyed maps, wrapped in the self-describing tag.
  function cborEnc(v) {
    const out = [];
    const head = (mt, n) => { n = big(n); if (n < 24n) out.push((mt << 5) | Number(n)); else if (n < 256n) out.push((mt << 5) | 24, Number(n)); else if (n < 65536n) out.push((mt << 5) | 25, Number(n >> 8n), Number(n & 255n)); else if (n < 4294967296n) out.push((mt << 5) | 26, Number(n >> 24n) & 255, Number(n >> 16n) & 255, Number(n >> 8n) & 255, Number(n & 255n)); else if (n < 18446744073709551616n) { out.push((mt << 5) | 27); for (let i = 7n; i >= 0n; i--) out.push(Number((n >> (8n * i)) & 255n)); } else throw new Error('cbor: over 64 bits'); };
    function item(v) {
      if (typeof v === 'number' || typeof v === 'bigint') { if (v < 0) throw new Error('cbor: negative'); head(0, v); }
      else if (typeof v === 'string') { const b = te.encode(v); head(3, b.length); out.push(...b); }
      else if (v instanceof Uint8Array) { head(2, v.length); out.push(...v); }
      else if (Array.isArray(v)) { head(4, v.length); v.forEach(item); }
      else if (v && typeof v === 'object') { const ks = Object.keys(v); head(5, ks.length); for (const k of ks) { item(k); item(v[k]); } }
      else throw new Error('cbor: cannot encode ' + typeof v);
    }
    out.push(0xd9, 0xd9, 0xf7);
    item(v);
    return Uint8Array.from(out);
  }

  // --- queries ---
  // An anonymous query straight to the IC HTTP API, for reads that need no
  // signature (ledger balances). The reply is taken as the boundary node
  // returns it, without checking node signatures, like the /api reads.
  const API = 'https://icp-api.io', QUERY_TIMEOUT_MS = 15_000;
  async function query(canisterId, method, types, values) {
    const content = { request_type: 'query', sender: Uint8Array.of(4), canister_id: principalFromText(canisterId), method_name: method, arg: encode(types, values), ingress_expiry: BigInt(Date.now() + 240_000) * 1_000_000n };
    const r = await fetch(API + '/api/v2/canister/' + canisterId + '/query', { method: 'POST', headers: { 'Content-Type': 'application/cbor' }, body: cborEnc({ content }), signal: AbortSignal.timeout(QUERY_TIMEOUT_MS) });
    if (!r.ok) throw new Error(method + ': HTTP ' + r.status);
    const res = cbor(new Uint8Array(await r.arrayBuffer()));
    if (res.status !== 'replied') throw new Error(method + ' rejected: ' + (res.reject_message || res.status));
    return decode(res.reply.arg);
  }

  // --- certificates ---
  const sha256 = async b => new Uint8Array(await crypto.subtle.digest('SHA-256', b));
  const cmp = (a, b) => { for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return a[i] - b[i]; return a.length - b.length; };
  const same = (a, b) => cmp(a, b) === 0;
  // Representation-independent hash of a call's content map: the request id.
  async function requestId(content) {
    const entries = [];
    for (const [k, v] of Object.entries(content)) {
      let vb;
      if (typeof v === 'string') vb = te.encode(v);
      else if (v instanceof Uint8Array) vb = v;
      else if (typeof v === 'number' || typeof v === 'bigint') vb = Uint8Array.from(uleb(v));
      else throw new Error('request id: unsupported field ' + k);
      entries.push([await sha256(te.encode(k)), await sha256(vb)]);
    }
    entries.sort((a, b) => cmp(a[0], b[0]));
    const all = []; for (const [kh, vh] of entries) all.push(...kh, ...vh);
    return sha256(Uint8Array.from(all));
  }
  // Hash-tree lookup: [0] empty, [1,l,r] fork, [2,label,sub] labeled, [3,leaf], [4,pruned].
  function flatten(t, out) { if (t[0] === 1) { flatten(t[1], out); flatten(t[2], out); } else if (t[0] !== 0) out.push(t); return out; }
  function lookup(tree, path) {
    let node = tree;
    for (const label of path) {
      const lb = typeof label === 'string' ? te.encode(label) : label;
      const asBytes = l => typeof l === 'string' ? te.encode(l) : l;
      const hit = flatten(node, []).find(n => n[0] === 2 && same(asBytes(n[1]), lb));
      if (!hit) return undefined;
      node = hit[2];
    }
    return node[0] === 3 ? node[1] : undefined;
  }
  // What a signed call returned, from the signer's {contentMap, certificate}.
  // Trusts the wallet's certificate rather than verifying the BLS signature
  // (docs/TENANCY.md, "Console"); the wallet is the party that just signed.
  async function callResult(res) {
    const content = cbor(b64dec(res.contentMap));
    const cert = cbor(b64dec(res.certificate));
    const id = await requestId(content);
    const reply = lookup(cert.tree, ['request_status', id, 'reply']);
    if (reply) return decode(reply);
    const status = lookup(cert.tree, ['request_status', id, 'status']);
    const st = status ? td.decode(status) : 'unknown';
    if (st === 'rejected') { const msg = lookup(cert.tree, ['request_status', id, 'reject_message']); throw new Error('call rejected: ' + (msg ? td.decode(msg) : '')); }
    throw new Error('no reply in certificate (status ' + st + ')');
  }
  const b64enc = bytes => btoa(String.fromCharCode(...bytes));
  const b64dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  return { encode, decode, cbor, cborEnc, query, requestId, lookup, callResult, principalToText, principalFromText, idlHash, b64enc, b64dec, hex };
})();
// === end candid ===
</script>
<script>
(() => {
  'use strict';
  const main = document.getElementById('main');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const enc = p => p.split('/').map(encodeURIComponent).join('/');
  const short = o => o.slice(0, 8);
  // One hash builder, one rule: repo, rev and each path component are
  // percent-encoded, so a branch named feature/login is one segment
  // (feature%2Flogin) and route() can split on '/' before decoding.
  const R = r => encodeURIComponent(r);
  const H = (repo, kind, rev, path) => '#/' + enc(repo) + (kind ? '/' + kind + '/' + R(rev) : '') + (path ? '/' + enc(path) : '');
  const when = t => t ? new Date(t * 1000).toISOString().replace('T', ' ').slice(0, 16) + ' UTC' : '';

  async function api(path) {
    const r = await fetch('/api/' + path, { headers: { 'Accept': 'application/json' } });
    const ct = r.headers.get('content-type') || '';
    const commit = r.headers.get('x-ic-git-commit');
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      if (ct.includes('json')) { try { msg = (await r.json()).error || msg; } catch (_) {} }
      throw new Error(msg);
    }
    return { data: ct.includes('json') ? await r.json() : await r.text(), commit };
  }

  // Where this page itself came from: the canister stamps every /site
  // response with the commit it served. Shown, not trusted -- the trusted
  // check is tools/verify.mjs against the registry.
  fetch(location.pathname, { method: 'GET', cache: 'no-store' }).then(r => {
    const c = r.headers.get('x-ic-git-commit'), repo = r.headers.get('x-ic-git-repo');
    if (c) document.getElementById('prov').innerHTML =
      'this page: <a class="oid" href="' + esc(H(repo, 'commit', c)) + '">' + esc(repo) + '@' + esc(short(c)) + '</a>';
  }).catch(() => {});

  const render = html => { main.innerHTML = html; };
  const fail = e => render('<p class="err">' + esc(e.message || e) + '</p>');

  function crumbs(repo, rev, kind, path) {
    const parts = path ? path.split('/') : [];
    let out = '<a href="' + esc(H(repo)) + '">' + esc(repo) + '</a>';
    let acc = '';
    parts.forEach((p, i) => {
      acc += (acc ? '/' : '') + p;
      const last = i === parts.length - 1;
      out += last && kind === 'blob'
        ? '<span>' + esc(p) + '</span>'
        : '<a href="' + esc(H(repo, 'tree', rev, acc)) + '">' + esc(p) + '</a>';
    });
    return '<div class="crumbs">' + out + '</div>';
  }

  function tabs(repo, rev, on) {
    const t = (k, label) => '<a class="' + (on === k ? 'on' : '') + '" href="' + esc(H(repo, k, rev)) + '">' + label + '</a>';
    return '<span class="tabs">' + t('tree', 'files') + t('commits', 'commits') + '</span>';
  }

  function refPicker(repo, refs, rev, kind, path) {
    const names = refs.map(r => r.name).sort();
    const opts = names.map(n => {
      const s = n.replace(/^refs\/(heads|tags)\//, '');
      return '<option value="' + esc(s) + '"' + (s === rev || n === rev ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
    const sel = '<select id="ref">' + opts + (names.some(n => n.replace(/^refs\/(heads|tags)\//, '') === rev) ? '' : '<option selected value="' + esc(rev) + '">' + esc(rev) + '</option>') + '</select>';
    setTimeout(() => {
      const el = document.getElementById('ref');
      if (el) el.onchange = () => { location.hash = H(repo, kind, el.value, path); };
    }, 0);
    return sel;
  }

  async function showRepos() {
    const { data } = await api('repos');
    if (!data.length) return render('<p class="muted">no repositories yet</p>');
    render('<h2>repositories</h2><table><tr><th>name</th><th>default branch</th><th>site</th><th>clone</th></tr>' +
      data.map(r => '<tr><td><a href="' + esc(H(r.name)) + '">' + esc(r.name) + '</a></td><td class="muted">' + esc(r.head.replace(/^refs\/heads\//, '')) + '</td><td>' +
        (r.site ? '<a href="/site/' + esc(enc(r.name)) + '/">/site/' + esc(r.name) + '/</a>' : '<span class="muted">&ndash;</span>') +
        '</td><td><code>git clone ' + esc(location.origin) + '/' + esc(enc(r.name)) + '.git</code></td></tr>').join('') + '</table>');
    Console.mount('repos');
  }

  async function showTree(repo, rev, path) {
    let refs, t, commit;
    try {
      [{ data: refs }, { data: t, commit }] = await Promise.all([api(enc(repo) + '/refs'), api(enc(repo) + '/tree/' + encodeURIComponent(rev) + (path ? '/' + enc(path) : ''))]);
    } catch (e) {
      // Only an unborn HEAD means "no commits yet". A stale rev, a bad path
      // or a failed /refs read is a real error and goes to route()'s fail().
      if (!/HEAD points at an unborn branch/.test(e.message || '')) throw e;
      // A repository with no commits yet: nothing to browse, everything to
      // configure. The ownership panel is what turns an empty repository
      // into one that can be pushed to at all -- the app canister, the
      // deploy config, the push token -- so this page, of all pages, must
      // still show it. Until it did, a repository created from a wallet
      // was a dead end: no token could be minted, so no first commit.
      render(crumbs(repo, rev, 'tree', path) +
        '<p class="muted">This repository has no commits yet; push a first one and its files appear here.</p>');
      Console.mount('repo', repo);
      return;
    }
    const rows = t.entries.map(e => {
      const p = (path ? path + '/' : '') + e.name;
      const href = e.kind === 'tree' ? H(repo, 'tree', rev, p) : e.kind === 'blob' ? H(repo, 'blob', rev, p) : null;
      const name = href ? '<a href="' + esc(href) + '">' + esc(e.name) + (e.kind === 'tree' ? '/' : '') + '</a>' : esc(e.name);
      return '<tr><td>' + name + '</td><td class="muted">' + esc(e.kind === 'blob' ? 'file' : e.kind) + '</td><td class="oid muted">' + esc(short(e.oid)) + '</td></tr>';
    }).join('');
    const up = path ? '<tr><td><a href="' + esc(H(repo, 'tree', rev, path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '')) + '">..</a></td><td></td><td></td></tr>' : '';
    render(crumbs(repo, rev, 'tree', path) +
      '<div class="row">' + refPicker(repo, refs, rev, 'tree', path) + tabs(repo, rev, 'tree') +
      '<span class="muted">at <a class="oid" href=\"' + esc(H(repo, 'commit', commit)) + '\">' + esc(short(commit)) + '</a></span></div>' +
      '<table>' + up + rows + '</table>');
    Console.mount('repo', repo);
  }

  async function showBlob(repo, rev, path) {
    const { data, commit } = await api(enc(repo) + '/blob/' + encodeURIComponent(rev) + '/' + enc(path));
    const binary = /[\x00-\x08\x0E-\x1F]/.test(data.slice(0, 8000));
    const body = binary
      ? '<p class="muted">binary file, ' + data.length + ' bytes</p>'
      : '<pre class="src">' + data.split('\n').map(l => '<span class="l">' + esc(l) + '</span>').join('') + '</pre>';
    render(crumbs(repo, rev, 'blob', path) +
      '<div class="row"><span class="muted">' + data.length + ' bytes at <a class="oid" href=\"' + esc(H(repo, 'commit', commit)) + '\">' + esc(short(commit)) + '</a></span>' +
      '<a href="/api/' + esc(enc(repo)) + '/blob/' + esc(encodeURIComponent(commit)) + '/' + esc(enc(path)) + '">raw</a>' +
      '<span class="muted"><code>git show ' + esc(short(commit)) + ':' + esc(path) + '</code> reproduces this</span></div>' + body);
  }

  async function showCommits(repo, rev) {
    const [{ data: refs }, { data: list }] = await Promise.all([api(enc(repo) + '/refs'), api(enc(repo) + '/commits/' + encodeURIComponent(rev) + '?n=50')]);
    const items = list.map(c => {
      const title = (c.message || '').split('\n')[0];
      return '<div class="commit"><a href=\"' + esc(H(repo, 'commit', c.oid)) + '\"><b>' + esc(title || '(no message)') + '</b></a>' +
        '<div class="muted">' + esc(c.author ? c.author.name : '?') + ' &middot; ' + esc(when(c.author && c.author.time)) + ' &middot; <a class="oid" href=\"' + esc(H(repo, 'tree', c.oid)) + '\">' + esc(short(c.oid)) + '</a></div></div>';
    }).join('');
    render(crumbs(repo, rev, 'commits', '') + '<div class="row">' + refPicker(repo, refs, rev, 'commits', '') + tabs(repo, rev, 'commits') + '</div>' + items);
  }

  async function showCommit(repo, oid) {
    const { data: c } = await api(enc(repo) + '/commit/' + encodeURIComponent(oid));
    const who = (label, id) => id ? '<tr><th>' + label + '</th><td>' + esc(id.name) + ' &lt;' + esc(id.email) + '&gt; <span class="muted">' + esc(when(id.time)) + ' ' + esc(id.tz) + '</span></td></tr>' : '';
    render(crumbs(repo, c.oid, 'commits', '') +
      '<table>' +
      '<tr><th>commit</th><td class="oid">' + esc(c.oid) + ' &middot; <a href=\"' + esc(H(repo, 'tree', c.oid)) + '\">browse files</a></td></tr>' +
      '<tr><th>tree</th><td class="oid">' + esc(c.tree) + '</td></tr>' +
      (c.parents.length ? '<tr><th>parents</th><td class="oid">' + c.parents.map(p => '<a href=\"' + esc(H(repo, 'commit', p)) + '\">' + esc(p) + '</a>').join('<br>') + '</td></tr>' : '') +
      who('author', c.author) + who('committer', c.committer) +
      '</table><pre>' + esc(c.message) + '</pre>');
    Console.mount('commit', repo, c.oid);
  }

  async function route() {
    const raw = location.hash.replace(/^#\/?/, '');
    const dec = x => { try { return decodeURIComponent(x); } catch (_) { return x; } };
    const seg = raw ? raw.split('/').map(dec) : [];
    try {
      if (!seg.length) return await showRepos();
      const repo = seg[0];
      const kind = seg[1] || 'tree';
      const rev = seg[2] || 'HEAD';
      const path = seg.slice(3).join('/');
      if (kind === 'tree') return await showTree(repo, rev, path);
      if (kind === 'blob') return await showBlob(repo, rev, path);
      if (kind === 'commits') return await showCommits(repo, rev);
      if (kind === 'commit') return await showCommit(repo, rev);
      throw new Error('unknown view: ' + kind);
    } catch (e) { fail(e); }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
<script>
// === console ===
// Signed-in mode (docs/TENANCY.md, "Console"). Reads come from /api like the
// rest of the page, except the wallet's ledger balances, which are anonymous
// queries to the IC HTTP API; every write is a canister call signed by the user's
// wallet through the IC signer standards (ICRC-25/27/29/49), which OISY
// implements. The page never holds a key: it encodes arguments, the wallet
// signs and submits, and the page decodes the reply from the certificate the
// wallet hands back.
const Console = (() => {
  'use strict';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const CANISTER = location.hostname.split('.')[0];
  const CYCLES_LEDGER = 'um5iw-rqaaa-aaaaq-qaaba-cai';
  const ICP_LEDGER = 'ryjl3-tyaaa-aaaaa-aaaba-cai';
  const CMC = 'rkp4c-7iaaa-aaaaa-aaaap-cai';
  const ICP_FEE = 10_000n; // e8s
  const ACCOUNT = { record: { owner: 'principal', subaccount: { opt: 'blob' } } };
  const SIGNER = { url: 'https://oisy.com/sign', origin: 'https://oisy.com' };
  const T = 1_000_000_000_000n;
  // Cycles for humans: T above 0.01 T, otherwise B or M.
  const fmtT = n => { n = BigInt(n); if (n >= 10_000_000_000n) { const whole = n / T, frac = (n % T) / 1_000_000_000n; return whole + '.' + String(frac).padStart(3, '0') + ' T'; } if (n >= 1_000_000_000n) return (Number(n) / 1e9).toFixed(1) + ' B cycles'; return (Number(n) / 1e6).toFixed(0) + ' M cycles'; };
  const short = p => p.length > 20 ? p.slice(0, 5) + '...' + p.slice(-3) : p;
  const fmtCycles = n => { const s = fmtT(n); return s.endsWith(' T') ? s + ' cycles' : s; };
  // ICP for humans: e8s to a decimal with the trailing zeros trimmed (at least two places).
  const fmtIcp = n => { n = BigInt(n); const s = (n % 100_000_000n).toString().padStart(8, '0').replace(/0+$/, '').padEnd(2, '0'); return (n / 100_000_000n) + '.' + s + ' ICP'; };
  const RESULT_TYPES = {}; // method -> nothing needed: replies are self-describing

  // --- signer (ICRC-25 over postMessage) ---
  // Mirrors the reference relying party (dfinity/oisy-wallet-signer): the
  // readiness ping is posted with target origin "*" because the popup may be
  // on a login screen or mid-redirect, replies are accepted only from the
  // popup window itself and from the signer's origin, and the user gets two
  // minutes to log in before the connection is abandoned.
  const CONNECT_TIMEOUT_MS = 180000, INTERACT_TIMEOUT_MS = 120000, PING_MS = 500;
  const signer = {
    win: null, ready: false, nextId: 1, pending: new Map(),
    listen() {
      if (this.listening) return; this.listening = true;
      window.addEventListener('message', e => {
        if (e.source !== this.win || e.origin !== SIGNER.origin) return;
        const d = e.data; if (!d || d.jsonrpc !== '2.0' || !this.pending.has(d.id)) return;
        const { resolve, reject } = this.pending.get(d.id); this.pending.delete(d.id);
        if (d.error) reject(new Error(d.error.message || ('signer error ' + d.error.code))); else resolve(d.result);
      });
    },
    request(method, params, timeoutMs, targetOrigin) {
      const id = this.nextId++;
      return new Promise((resolve, reject) => {
        this.pending.set(id, { resolve, reject });
        const msg = { jsonrpc: '2.0', id, method };
        if (params !== undefined) msg.params = params;
        this.win.postMessage(msg, targetOrigin || SIGNER.origin);
        if (timeoutMs) setTimeout(() => { if (this.pending.has(id)) { this.pending.delete(id); reject(new Error('timeout')); } }, timeoutMs);
      });
    },
    async connect(progress) {
      this.listen();
      if (!this.win || this.win.closed) { this.win = window.open(SIGNER.url, 'ic-git-signer', 'width=480,height=720'); this.ready = false; }
      if (!this.win) throw new Error('popup blocked: allow popups for this site');
      if (this.ready) { try { this.win.focus(); } catch (_) {} return this; }
      const until = Date.now() + CONNECT_TIMEOUT_MS;
      let n = 0;
      while (!this.ready) {
        if (this.win.closed) throw new Error('wallet window was closed');
        if (Date.now() > until) throw new Error('wallet did not answer within ' + (CONNECT_TIMEOUT_MS / 1000) + 's');
        if (progress && n++ % 10 === 0) progress('waiting for OISY' + (n > 10 ? ' (log in there if asked)' : '') + '...');
        try { if (await this.request('icrc29_status', undefined, PING_MS, '*') === 'ready') this.ready = true; } catch (_) {}
      }
      return this;
    },
    async accounts() {
      await this.request('icrc25_request_permissions', { scopes: [{ method: 'icrc27_accounts' }, { method: 'icrc49_call_canister' }] }, INTERACT_TIMEOUT_MS);
      const r = await this.request('icrc27_accounts', undefined, INTERACT_TIMEOUT_MS);
      return (r.accounts || []).map(a => a.owner);
    },
    async call(canisterId, sender, method, types, values) {
      const arg = IC.b64enc(IC.encode(types, values));
      const r = await this.request('icrc49_call_canister', { canisterId, sender, method, arg }, INTERACT_TIMEOUT_MS);
      return (await IC.callResult(r))[0];
    },
    // Close the popup when an interaction is over; the next write reopens
    // it. Left open, OISY sits on "waiting for the dapp".
    disconnect() {
      try { if (this.win && !this.win.closed) this.win.close(); } catch (_) {}
      this.win = null; this.ready = false;
    },
  };

  // --- session ---
  let me = null;
  try { me = localStorage.getItem('ic-git.principal'); } catch (_) {}
  const walletEl = () => document.getElementById('wallet');
  function paintWallet() {
    const el = walletEl(); if (!el) return;
    el.innerHTML = me
      ? '<span class="muted">signed in as</span> <span class="oid" title="' + esc(me) + '">' + esc(short(me)) + '</span> <button id="signout">sign out</button>'
      : '<button id="signin">connect wallet</button>';
    const si = document.getElementById('signin'), so = document.getElementById('signout');
    if (si) si.onclick = signIn;
    if (so) so.onclick = () => { me = null; try { localStorage.removeItem('ic-git.principal'); } catch (_) {} signer.disconnect(); paintWallet(); location.reload(); };
  }
  async function signIn() {
    const el = walletEl();
    const say = msg => { if (el) el.innerHTML = '<span class="muted">' + esc(msg) + '</span>'; };
    try {
      say('opening OISY...');
      await signer.connect(say);
      say('approve the connection in OISY...');
      const accounts = await signer.accounts();
      if (!accounts.length) throw new Error('wallet returned no accounts');
      me = accounts[0]; try { localStorage.setItem('ic-git.principal', me); } catch (_) {}
      signer.disconnect();
      paintWallet(); location.reload();
    } catch (e) {
      signer.disconnect();
      paintWallet();
      if (el) el.insertAdjacentHTML('afterbegin', '<span class="bad">sign in failed: ' + esc(e.message) + '</span> ');
    }
  }
  // One wallet session per user action. The popup is opened once, inside
  // the click that asked for it, and closed when the outermost action is
  // over. An action that signs more than once (deposit is two calls,
  // reinstall is three) must not reopen the popup between them: a
  // window.open that runs after an await has left the user's click behind,
  // and the browser's popup blocker refuses it -- which is how the first
  // half of a deposit could succeed and the second half never happen.
  // An action counts itself in before it waits for the connection, not
  // after: otherwise an action that finishes while a second one is still
  // waiting for OISY to answer would see no other session and close the
  // popup the second one is waiting on.
  let sessions = 0;
  async function session(fn) {
    if (!me) throw new Error('connect a wallet first');
    sessions++;
    try { await signer.connect(null); return await fn(sign); }
    finally { if (--sessions === 0) signer.disconnect(); }
  }
  // Sign one call in the open session, decode, unwrap Result.
  async function sign(method, types, values, canister) {
    const r = await signer.call(canister || CANISTER, me, method, types, values);
    if (r && typeof r === 'object' && 'Err' in r) throw new Error(typeof r.Err === 'string' ? r.Err : JSON.stringify(r.Err, (k, v) => typeof v === 'bigint' ? v.toString() : v));
    return r && typeof r === 'object' && 'Ok' in r ? r.Ok : r;
  }
  // A single-call action.
  const write = (method, types, values, canister) => session(s => s(method, types, values, canister));

  // --- panels ---
  const get = async path => { const r = await fetch('/api/' + path); if (!r.ok) throw new Error((await r.json()).error || r.statusText); return r.json(); };
  const status = (id, msg, ok) => { const el = document.getElementById(id); if (el) { el.textContent = msg; el.className = 'status ' + (ok ? 'ok' : 'bad'); } };
  const form = (id, fields, label) => '<form id="' + id + '">' + fields.map(f => '<input name="' + f.name + '" placeholder="' + esc(f.placeholder) + '"' + (f.value ? ' value="' + esc(f.value) + '"' : '') + (f.list ? ' list="' + f.list + '"' : '') + '>').join('') + '<button>' + esc(label) + '</button></form>';
  // A read that arrives after the panel is on screen: fill its slot when it
  // answers, `?` when it does not. Nothing else on the page waits for it.
  const land = (id, p, fmt) => p.then(v => { const el = document.getElementById(id); if (el) el.textContent = v === undefined ? '?' : fmt(v); });
  // The submit button stays disabled while its call is in flight: a second
  // click would sign and pay for the same action twice.
  const onsubmit = (id, fn) => { const f = document.getElementById(id); if (f) f.onsubmit = async e => { e.preventDefault(); const b = f.querySelector('button'); if (b.disabled) return; b.disabled = true; const st = id + '-st'; status(st, 'waiting for wallet...', true); try { status(st, await fn(Object.fromEntries(new FormData(f))), true); } catch (err) { status(st, err.message, false); } finally { b.disabled = false; } }; };
  const cycles = s => { const t = Number(s); if (!(t > 0)) throw new Error('enter an amount in T cycles'); return BigInt(Math.round(t * 1e9)) * 1_000n; };

  async function reposPanel() {
    let html = '<div class="panel"><h3>console</h3>';
    if (!me) { html += '<p class="muted">Connect a wallet to create repositories, mint push tokens, manage members and votes, and deposit cycles. Reads need no sign-in.</p></div>'; return html; }
    // What the wallet holds on the ledgers, read anonymously; null when a ledger did not answer.
    // They start now and land in the panel when they answer; the controls
    // below wait only for the same-origin reads.
    const held = ledger => IC.query(ledger, 'icrc1_balance_of', [ACCOUNT], [{ owner: me, subaccount: null }]).then(r => r[0], e => { console.warn('ledger ' + ledger + ': ' + e.message); return undefined; });
    const icp = held(ICP_LEDGER), cyc = held(CYCLES_LEDGER);
    const [pricing, acct] = await Promise.all([
      get('pricing'),
      get('account/' + encodeURIComponent(me)).catch(() => ({ balance: 0, repos: [] }))]);
    html += '<p>wallet holds <b id="held-icp">...</b> and <b id="held-cyc">...</b> <span class="muted">(on the ledgers, ' + esc(short(me)) + ')</span></p>' +
      '<p>ic-git balance <b>' + fmtT(acct.balance) + '</b> <span class="muted">(' + acct.balance + ' cycles)</span>' +
      (acct.repos.length ? ' &middot; your repos: ' + acct.repos.map(r => '<a href="#/' + encodeURIComponent(r) + '">' + esc(r) + '</a>').join(', ') : '') + '</p>' +
      '<p class="muted">creating a repo costs ' + fmtT(pricing.create_repo) + '; a push costs ' + fmtT(pricing.push_base) + ' + ' + pricing.push_per_byte + ' cycles/byte; storage rent ' + pricing.rent_per_byte_year + ' cycles per byte-year.</p>' +
      form('f-deposit', [{ name: 'amount', placeholder: 'deposit, in T cycles (e.g. 2)' }], 'deposit from cycles ledger') + '<p id="f-deposit-st" class="status"></p>' +
      form('f-icp', [{ name: 'amount', placeholder: 'deposit, in ICP (e.g. 0.5; at least 0.01)' }], 'deposit from ICP') +
      '<p id="icp-rate" class="muted">...</p><p id="f-icp-st" class="status"></p><div id="icp-pending"></div>' +
      form('f-create', [{ name: 'name', placeholder: 'new repo name' }], 'create repo') + '<p id="f-create-st" class="status"></p></div>';
    setTimeout(() => {
      land('held-icp', icp, fmtIcp); land('held-cyc', cyc, fmtCycles);
      // ICP deposits (icp.rs): the CMC's current rate, for an estimate; the
      // canister credits whatever the CMC actually converts. 1 XDR is 1 T
      // cycles, so cycles per ICP = xdr_permyriad_per_icp * 10^8.
      const rate = IC.query(CMC, 'get_icp_xdr_conversion_rate', [], []).then(r => BigInt(r[0].data.xdr_permyriad_per_icp) * 100_000_000n, e => { console.warn('cmc rate: ' + e.message); return undefined; });
      land('icp-rate', rate, perIcp => 'at the current rate 1 ICP is about ' + fmtCycles(perIcp) + '; the wallet pays the amount plus two ICP ledger fees (' + fmtIcp(2n * ICP_FEE) + ').');
      // ICP amounts are parsed as decimals, never through floating point.
      const e8s = s => { const m = /^\s*(\d*)(?:\.(\d{0,8}))?\s*$/.exec(s); if (!m || (!m[1] && !m[2])) throw new Error('enter an amount in ICP, e.g. 0.5'); return BigInt(m[1] || '0') * 100_000_000n + BigInt((m[2] || '').padEnd(8, '0')); };
      onsubmit('f-icp', async v => {
        const amount = e8s(v.amount);
        if (amount < 1_000_000n) throw new Error('deposit at least 0.01 ICP');
        // 1. approve ic-git on the ICP ledger for the amount plus the fee its
        // transfer_from takes out of the allowance; 2. ic-git pulls it to the
        // cycles minting canister and credits the cycles. One wallet session.
        const APPROVE = { record: { from_subaccount: { opt: 'blob' }, spender: ACCOUNT, amount: 'nat', expected_allowance: { opt: 'nat' }, expires_at: { opt: 'nat64' }, fee: { opt: 'nat' }, memo: { opt: 'blob' }, created_at_time: { opt: 'nat64' } } };
        const balance = await session(async s => {
          await s('icrc2_approve', [APPROVE], [{ from_subaccount: null, spender: { owner: CANISTER, subaccount: null }, amount: amount + ICP_FEE, expected_allowance: null, expires_at: null, fee: null, memo: null, created_at_time: null }], ICP_LEDGER);
          return s('deposit_from_icp', ['nat64'], [amount]);
        });
        setTimeout(() => location.reload(), 1200);
        return 'deposited ' + fmtIcp(amount) + '; balance now ' + fmtT(balance);
      });
      // Deposits whose ICP reached the CMC but whose cycles were not
      // credited: a finish button retries the notify.
      IC.query(CANISTER, 'pending_icp_deposits', [], []).then(r => {
        const mine = r[0].filter(p => p.who === me);
        const el = document.getElementById('icp-pending');
        if (!el || !mine.length) return;
        el.innerHTML = '<p class="bad">ICP deposits waiting on the cycles minting canister:</p><table>' + mine.map(p => '<tr><td>' + esc(fmtIcp(p.e8s)) + '</td><td class="muted">block ' + esc(p.block_index) +
          (p.last_error ? ': ' + esc(p.last_error) : '') + '</td><td><button class="icp-finish" type="button" data-b="' + esc(p.block_index) + '">finish</button></td></tr>').join('') + '</table><p id="icp-pending-st" class="status"></p>';
        el.querySelectorAll('button.icp-finish').forEach(b => { b.onclick = async () => {
          b.disabled = true;
          status('icp-pending-st', 'waiting for wallet...', true);
          try { const bal = await write('finish_icp_deposit', ['nat64'], [BigInt(b.dataset.b)]); status('icp-pending-st', 'credited; balance now ' + fmtT(bal), true); setTimeout(() => location.reload(), 1200); }
          catch (e) { b.disabled = false; status('icp-pending-st', e.message, false); }
        }; });
      }, e => console.warn('pending_icp_deposits: ' + e.message));
      onsubmit('f-deposit', async v => {
        const amount = cycles(v.amount);
        const fee = 100_000_000n;
        // Three ledger fees stand between the wallet and the balance. The
        // approve itself costs one, paid straight from the wallet. ic-git
        // then pulls (amount + fee) with transfer_from, and the ledger takes
        // its own fee on top of what it moves, out of the allowance; then
        // ic-git withdraws the cycles into itself, which costs the third
        // fee, and credits the rest -- exactly `amount`. So the allowance is
        // amount + 2 fees, the deposit call names amount + 1 fee, and the
        // wallet needs amount + 3 fees.
        // 1. approve ic-git on the cycles ledger, 2. ic-git pulls it.
        const APPROVE = { record: { from_subaccount: { opt: 'blob' }, spender: ACCOUNT, amount: 'nat', expected_allowance: { opt: 'nat' }, expires_at: { opt: 'nat64' }, fee: { opt: 'nat' }, memo: { opt: 'blob' }, created_at_time: { opt: 'nat64' } } };
        const balance = await session(async s => {
          await s('icrc2_approve', [APPROVE], [{ from_subaccount: null, spender: { owner: CANISTER, subaccount: null }, amount: amount + 2n * fee, expected_allowance: null, expires_at: null, fee: null, memo: null, created_at_time: null }], CYCLES_LEDGER);
          return s('deposit_from_cycles_ledger', ['nat64'], [amount + fee]);
        });
        setTimeout(() => location.reload(), 1200);
        return 'deposited; balance now ' + fmtT(balance);
      });
      onsubmit('f-create', async v => { await write('create_repo', ['text'], [v.name.trim()]); setTimeout(() => { location.hash = '#/' + encodeURIComponent(v.name.trim()); }, 800); return 'created ' + v.name; });
    }, 0);
    return html;
  }

  async function repoPanel(repo) {
    const info = await get(encodeURIComponent(repo) + '/info');
    const isOwner = me && info.owner === me, isWriter = isOwner || (me && info.members.some(m => m.principal === me && m.role === 'writer'));
    // What the repo deploys and serves. Both are canister queries with no
    // /api route, so they go to the IC HTTP API like the ledger reads and
    // must not hold the panel: null means not configured, undefined means
    // the read failed.
    const cfg = method => IC.query(CANISTER, method, ['text'], [repo]).then(r => r[0], e => { console.warn(method + ': ' + e.message); return undefined; });
    const deployCfg = cfg('get_deploy_config'), evmCfg = cfg('get_evm_deploy_config'), siteCfg = cfg('get_site');
    // The fee table, for saying what a deploy costs before it is run.
    const pricing = get('pricing').catch(e => { console.warn('pricing: ' + e.message); return undefined; });
    let html = '<div class="panel"><h3>ownership</h3>' +
      '<p>owner: ' + (info.owner ? '<span class="oid" title="' + esc(info.owner) + '">' + esc(short(info.owner)) + '</span>' : '<span class="muted">operator (exempt)</span>') +
      ' &middot; storage ' + info.storage_bytes + ' bytes' + (info.delinquent ? ' &middot; <b class="bad">behind on rent</b>' : '') +
      ' &middot; deploys need ' + info.required_votes + ' approval' + (info.required_votes === 1 ? '' : 's') +
      (info.app_canister ? ' &middot; app canister <span class="oid">' + esc(info.app_canister) + '</span>' : '') +
      (info.require_signed_push ? ' &middot; <b>pushes must be signed</b>' : '') + '</p>' +
      '<p>on push, deploys <b id="cfg-deploy">...</b> &middot; site <b id="cfg-site">...</b></p>';
    if (info.members.length) html += '<table><tr><th>member</th><th>role</th>' + (isOwner ? '<th></th>' : '') + '</tr>' + info.members.map(m => '<tr><td class="oid">' + esc(m.principal) + '</td><td>' + esc(m.role) + '</td>' + (isOwner ? '<td><button class="rm" data-p="' + esc(m.principal) + '">remove</button></td>' : '') + '</tr>').join('') + '</table>';
    if (isWriter) html += form('f-token', [{ name: 'days', placeholder: 'lifetime in days (1-365, default 30)' }, { name: 'key', placeholder: 'bind to an SSH key: contents of ~/.ssh/id_ed25519.pub' + (info.require_signed_push ? ' (required here)' : ' (optional)') }], 'mint push token') + '<p id="f-token-st" class="status tok"></p>' +
      '<div id="tok-list"><p class="muted">push tokens: ...</p></div><p id="tok-list-st" class="status"></p>';
    if (isOwner) html += form('f-member', [{ name: 'principal', placeholder: 'principal' }, { name: 'role', placeholder: 'writer or voter', value: 'writer' }], 'add member') + '<p id="f-member-st" class="status"></p>' +
      form('f-votes', [{ name: 'k', placeholder: 'approvals required before deploy', value: String(info.required_votes) }], 'set required votes') + '<p id="f-votes-st" class="status"></p>' +
      form('f-signed', [], info.require_signed_push ? 'stop requiring signed pushes' : 'require signed pushes (key-bound tokens only)') + '<p id="f-signed-st" class="status"></p>' +
      (info.app_canister
        ? form('f-topup', [{ name: 'amount', placeholder: 'T cycles to add' }], 'top up app canister') + '<p id="f-topup-st" class="status"></p>'
        : form('f-app', [{ name: 'amount', placeholder: 'T cycles (min 1)' }], 'create app canister') + '<p id="f-app-st" class="status"></p>');
    if (isOwner) html += (info.app_canister
        ? form('f-deploy', [{ name: 'path', placeholder: 'path in the commit, e.g. app.wasm (.wasm, .wat or .lang)' }], 'deploy on push into the app canister') + '<p id="f-deploy-st" class="status"></p>'
        : '<p class="muted">create the app canister above, then choose what each push deploys into it.</p>') +
      form('f-site', [{ name: 'root', placeholder: 'directory to serve, e.g. site (empty = repo root)' }], 'serve as site') + '<p id="f-site-st" class="status"></p>' +
      // Shown once the site config lands and says the repo is served: the
      // record attests the served entrypoint, so there is nothing to publish
      // for a repo that serves no site.
      '<div id="box-pubsite" hidden>' + form('f-pubsite', [], 'publish site record to the EVM registry') + '<p id="pubsite-cost" class="muted">...</p><p id="f-pubsite-st" class="status"></p></div>' +
      (info.app_canister
        ? form('f-deploynow', [], 'deploy now') + ' <button id="btn-reinstall" class="danger" type="button" disabled>reinstall...</button>' +
          '<p id="deploy-cost" class="muted">...</p><p id="f-deploynow-st" class="status"></p>' +
          // The guard: no native dialog (those block the page), a box the
          // owner has to read, and a run button that stays disabled until
          // the typed name is the repo's. The box is written from the deploy
          // config once it lands, because what a reinstall wipes is the
          // configured target, which need not be this repo's app canister;
          // and a deploy runs every configured leg, so an EVM contract
          // deploy and its cost are named too. No undo on either side.
          '<div id="box-reinstall" class="confirm" hidden><p id="reinstall-what" class="bad"></p>' +
          '<p>Type the repository name <b>' + esc(repo) + '</b> to confirm: <input id="in-reinstall" autocomplete="off"> <button id="go-reinstall" class="danger" type="button" disabled>reinstall now</button> <button id="cancel-reinstall" type="button">cancel</button></p><p id="reinstall-st" class="status"></p></div>'
        : '');
    if (!me) html += '<p class="muted">connect a wallet to manage this repo.</p>';
    html += '</div>';
    setTimeout(() => {
      // Live tokens by id, with a revoke button each. Redrawn in place after
      // a mint or a revoke: a reload would wipe the minted token, which is
      // shown once.
      const nsDate = ns => new Date(Number(BigInt(ns) / 1_000_000n)).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
      // Resolves to the list (or undefined if it could not be read), so the
      // mint can find its own token in it.
      // A bound key as ssh-keygen -l prints it, and as git names the pusher.
      const fingerprint = async text => {
        const blob = Uint8Array.from(atob(text.split(' ')[1] || ''), c => c.charCodeAt(0));
        const d = new Uint8Array(await crypto.subtle.digest('SHA-256', blob));
        return 'SHA256:' + btoa(String.fromCharCode(...d)).replace(/=+$/, '');
      };
      const tokens = () => IC.query(CANISTER, 'list_push_tokens', ['text'], [repo]).then(async r => {
        const ts = r[0];
        const el = document.getElementById('tok-list');
        if (!el) return ts;
        const fps = await Promise.all(ts.map(t => t.key ? fingerprint(t.key).catch(() => t.key) : null));
        el.innerHTML = !ts.length ? '<p class="muted">no live push tokens.</p>'
          : '<table><tr><th>push token</th><th>minted by</th><th>bound key</th><th>expires</th><th></th></tr>' + ts.map((t, i) => '<tr><td class="oid">' + esc(t.id) + '</td><td class="oid">' +
            (t.minted_by ? esc(short(t.minted_by)) : '<span class="muted">before expiry existed</span>') + '</td><td class="oid">' +
            (fps[i] ? esc(fps[i]) : '<span class="muted">none</span>') + '</td><td>' + esc(nsDate(t.expires_ns)) +
            '</td><td><button class="tok-rm" type="button" data-id="' + esc(t.id) + '">revoke</button></td></tr>').join('') + '</table>';
        el.querySelectorAll('button.tok-rm').forEach(b => { b.onclick = async () => {
          b.disabled = true;
          status('tok-list-st', 'waiting for wallet...', true);
          try { await write('revoke_push_token_id', ['text'], [b.dataset.id]); status('tok-list-st', 'revoked ' + b.dataset.id, true); tokens(); }
          catch (e) { b.disabled = false; status('tok-list-st', e.message, false); }
        }; });
        return ts;
      }, e => { const el = document.getElementById('tok-list'); if (el) el.innerHTML = '<p class="muted">push tokens: could not be read (' + esc(e.message) + ')</p>'; });
      if (isWriter) tokens();
      onsubmit('f-token', async v => {
        const d = v.days.trim();
        const days = d ? Number(d) : null;
        if (days !== null && !(Number.isInteger(days) && days >= 1 && days <= 365)) throw new Error('lifetime is a whole number of days, 1 to 365');
        const key = v.key.trim() || null;
        if (key && !key.startsWith('ssh-ed25519 ')) throw new Error('only ssh-ed25519 keys can be bound (the contents of ~/.ssh/id_ed25519.pub)');
        const token = await write('create_push_token', ['text', { opt: 'nat32' }, { opt: 'text' }], [repo, days, key]);
        // The expiry comes from the canister, not from a default copied
        // here: a token's id is the first 16 hex characters of the sha256 of
        // its text, so the new token can be found in the refreshed list.
        // The token is shown once, so a failure here must not hide it.
        let mine;
        try {
          const id = IC.hex(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(token))).slice(0, 8));
          mine = ((await tokens()) || []).find(t => t.id === id);
        } catch (e) { console.warn('push token list: ' + e.message); }
        return 'token (shown once' + (mine ? ', valid until ' + nsDate(mine.expires_ns) : '') + '): ' + token + '  -> git push https://ic:<token>@' + location.host + '/' + repo + '.git main' +
          (key ? '  -- bound to that key, so sign pushes with it: git config gpg.format ssh; git config user.signingkey <path to that .pub>; git config push.gpgSign if-asked' : '');
      });
      onsubmit('f-signed', async () => {
        await write('set_require_signed_push', ['text', 'bool'], [repo, !info.require_signed_push]);
        setTimeout(() => location.reload(), 800);
        return info.require_signed_push ? 'signed pushes no longer required' : 'pushes must now be signed: tokens without a bound key are refused';
      });
      onsubmit('f-member', async v => { await write('add_member', ['text', 'principal', 'text'], [repo, v.principal.trim(), v.role.trim()]); setTimeout(() => location.reload(), 800); return 'added'; });
      onsubmit('f-votes', async v => { await write('set_required_votes', ['text', 'nat32'], [repo, Number(v.k)]); setTimeout(() => location.reload(), 800); return 'saved'; });
      onsubmit('f-app', async v => { const id = await write('create_app_canister', ['text', 'nat64'], [repo, cycles(v.amount)]); setTimeout(() => location.reload(), 800); return 'created app canister ' + id; });
      onsubmit('f-topup', async v => { await write('top_up_app_canister', ['text', 'nat64'], [repo, cycles(v.amount)]); return 'topped up'; });
      const wasmLeg = c => c.source_path + ' into ' + (c.target === info.app_canister ? 'the app canister' : short(c.target)) + ' (' + Object.keys(c.mode)[0] + ')';
      const evmLeg = c => 'a contract from ' + c.source_path + ' on the EVM chain (gas limit ' + c.gas_limit + ')';
      land('cfg-deploy', Promise.all([deployCfg, evmCfg]), ([w, e]) => w === undefined || e === undefined ? '?' : [w && wasmLeg(w), e && evmLeg(e)].filter(Boolean).join(' and ') || 'nothing (not configured)');
      land('cfg-site', siteCfg, c => c === null ? 'not served' : 'served from ' + (c.root ? c.root + '/' : 'the repo root') + ' at /site/' + repo + '/' + (info.required_votes ? ', from the newest approved commit' : ''));
      // "app" names the repo's own app canister; the canister resolves it.
      onsubmit('f-deploy', async v => { await write('set_wasm_deploy', ['text', 'text', 'text'], [repo, 'app', v.path.trim()]); setTimeout(() => location.reload(), 800); return 'each push to the deploy branch now installs ' + v.path.trim(); });
      onsubmit('f-site', async v => { const root = v.root.trim().replace(/^\/+|\/+$/g, ''); await write('set_site', ['text', 'text'], [repo, root]); setTimeout(() => location.reload(), 800); return 'serving ' + (root || 'the repo root') + ' at /site/' + repo + '/'; });
      // What deploy now and reinstall install: with votes required, the
      // approved commit the site serves, not the tip.
      const release = info.required_votes ? 'the newest approved commit' : 'the deploy-branch tip';
      // A failed read (undefined) still shows the box, with a warning: the
      // canister refuses an unserved repo before charging anything.
      Promise.all([siteCfg, pricing]).then(([c, pr]) => {
        const box = document.getElementById('box-pubsite');
        if (!box || c === null) return;
        box.hidden = false;
        document.getElementById('pubsite-cost').textContent = c === undefined || pr === undefined
          ? 'could not read the site config or the fee table; reload before publishing.'
          : 'writes set("' + repo + '#site", ' + release + ', sha256 of the served entrypoint) from the canister\'s EOA and charges ' +
            fmtT(pr.evm_action) + ' from the repo balance; gas is paid on that chain by the signer, not in cycles.';
      });
      // The call returns once the transaction is broadcast, not mined.
      onsubmit('f-pubsite', async () => { const t = await write('evm_registry_publish_site', ['text'], [repo]); return 'broadcast ' + repo + '#site: tx ' + t.tx_hash + ' (nonce ' + t.nonce + '); not yet confirmed on chain'; });
      const outcome = d => (d.ok ? 'deployed ' : 'deploy failed: ') + d.message + ' (commit ' + short(d.commit) + (d.wasm_sha256 ? ', wasm sha256 ' + d.wasm_sha256.slice(0, 12) + ')' : ')');
      onsubmit('f-deploynow', async () => outcome(await write('deploy_now', ['text'], [repo])));
      const box = document.getElementById('box-reinstall'), inp = document.getElementById('in-reinstall'), go = document.getElementById('go-reinstall');
      const btn = document.getElementById('btn-reinstall'), cancel = document.getElementById('cancel-reinstall');
      // What deploy now and reinstall will do and charge, from the configs.
      // A deploy runs every configured leg: the EVM leg broadcasts a new
      // CREATE transaction each time, which costs ic-git's fee here and gas
      // on the other chain, and is not undone by anything on this side.
      if (btn) Promise.all([deployCfg, evmCfg, pricing]).then(([w, e, pr]) => {
        const cost = document.getElementById('deploy-cost'), what = document.getElementById('reinstall-what');
        if (w === undefined || e === undefined || pr === undefined) { cost.textContent = 'could not read the deploy config or the fee table; reload before deploying.'; return; }
        const fee = (w ? pr.ic_deploy : 0) + (e ? pr.evm_action : 0);
        const evmNote = e ? 'a new CREATE transaction for ' + e.source_path + ' on the EVM chain (gas limit ' + e.gas_limit + '): a fresh contract at a new address, gas paid on that chain by the signer, not in cycles.' : '';
        cost.textContent = !w && !e ? 'nothing is configured to deploy.'
          : 'deploy now runs every configured leg against ' + release + ' and charges ' + fmtT(fee) + ' from the repo balance.' + (e ? ' It also broadcasts ' + evmNote : '');
        if (!w) { btn.title = 'nothing is configured to deploy into a canister'; return; }
        const target = w.target === info.app_canister
          ? 'app canister ' + w.target
          : 'canister ' + w.target + ', the configured deploy target, which is NOT this repo\'s app canister (' + info.app_canister + ')';
        what.innerHTML = '<b>Reinstall wipes every byte of state in ' + esc(target) + '</b> and installs ' + esc(w.source_path) + ' from ' + release + '. Ballots, balances, anything the app stored: gone. There is no undo.' +
          (e ? '<br><b>It also redeploys the EVM contract</b>, broadcasting ' + esc(evmNote) : '') + '<br>ic-git charges ' + esc(fmtT(fee)) + ' for the deploy.';
        btn.disabled = false;
      });
      if (btn) btn.onclick = () => { box.hidden = false; inp.value = ''; go.disabled = true; inp.focus(); };
      if (cancel) cancel.onclick = () => { box.hidden = true; };
      if (inp) inp.oninput = () => { go.disabled = inp.value.trim() !== repo; };
      if (go) go.onclick = async () => {
        if (inp.value.trim() !== repo) return;
        go.disabled = true; btn.disabled = true;
        // The mode is a setting, not an action: it stays until changed. So
        // switch, deploy, and switch back, and say so loudly if the switch
        // back did not happen -- every later push would wipe state again.
        let restored = false;
        try {
          // All three calls in one wallet session: the popup opened by this
          // click stays open, so no call is refused by the popup blocker.
          await session(async s => {
            try {
              status('reinstall-st', 'switching the install mode to reinstall...', true);
              await s('set_deploy_mode', ['text', 'text'], [repo, 'reinstall']);
              status('reinstall-st', 'reinstalling from ' + release + '...', true);
              const d = await s('deploy_now', ['text'], [repo]);
              status('reinstall-st', 'switching the install mode back to upgrade...', true);
              await s('set_deploy_mode', ['text', 'text'], [repo, 'upgrade']);
              restored = true;
              status('reinstall-st', outcome(d) + '; install mode is back to upgrade', d.ok);
            } catch (e) {
              if (!restored) { try { await s('set_deploy_mode', ['text', 'text'], [repo, 'upgrade']); restored = true; } catch (_) {} }
              throw e;
            }
          });
        } catch (e) {
          status('reinstall-st', e.message + (restored ? '; install mode is back to upgrade' : '. INSTALL MODE IS STILL REINSTALL: every push will wipe the deploy target until you set it back'), false);
        } finally { btn.disabled = false; }
      };
      document.querySelectorAll('button.rm').forEach(b => { b.onclick = async () => { try { await write('remove_member', ['text', 'principal'], [repo, b.dataset.p]); location.reload(); } catch (e) { alert(e.message); } }; });
    }, 0);
    return html;
  }

  async function commitPanel(repo, oid) {
    const [info, votes] = await Promise.all([get(encodeURIComponent(repo) + '/info'), get(encodeURIComponent(repo) + '/votes/' + oid)]);
    const yes = votes.filter(v => v.approve).length;
    const canVote = me && (info.owner === me || info.members.some(m => m.principal === me && m.role === 'voter'));
    let html = '<div class="panel"><h3>approvals</h3><p>' + yes + ' approve' + (yes === 1 ? 's' : '') + ' of ' + info.required_votes + ' required' + (votes.length ? '</p><table>' + votes.map(v => '<tr><td class="oid">' + esc(v.principal) + '</td><td>' + (v.approve ? 'approve' : 'reject') + '</td></tr>').join('') + '</table>' : '</p>');
    if (canVote) html += '<form id="f-vote"><button data-v="1">approve</button><button data-v="0">reject</button></form><p id="f-vote-st" class="status"></p>';
    html += '</div>';
    setTimeout(() => {
      document.querySelectorAll('#f-vote button').forEach(b => { b.onclick = async e => { e.preventDefault(); status('f-vote-st', 'waiting for wallet...', true); try { const r = await write('vote', ['text', 'text', 'bool'], [repo, oid, b.dataset.v === '1']); status('f-vote-st', 'recorded: ' + r[0] + ' of ' + r[1], true); setTimeout(() => location.reload(), 800); } catch (err) { status('f-vote-st', err.message, false); } }; });
    }, 0);
    return html;
  }

  async function mount(view, repo, oid) {
    paintWallet();
    const main = document.getElementById('main');
    try {
      const html = view === 'repos' ? await reposPanel() : view === 'repo' ? await repoPanel(repo) : await commitPanel(repo, oid);
      main.insertAdjacentHTML('beforeend', html);
    } catch (e) { main.insertAdjacentHTML('beforeend', '<p class="muted">console unavailable: ' + esc(e.message) + '</p>'); }
  }
  paintWallet();
  return { mount };
})();
// === end console ===
</script>
</body>
</html>
