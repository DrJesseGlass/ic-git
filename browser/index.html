        } finally { btn.disabled = false; }
      };
      document.querySelectorAll('button.rm').forEach(b => { b.onclick = async () => { try { await write('remove_member', ['text', 'principal'], [repo, b.dataset.p]); location.reload(); } catch (e) { alert(e.message); } }; });
    }, 0);
    return html;
  }

  // --- governance (docs/GOVERNANCE.md) ---
  // The candid shape of a policy change, for the encoder and for reading
  // the JSON the API returns ({"RequiredVotes":{"k":2}}, ...).
  const CHANGE = { variant: { RequiredVotes: { record: { k: 'nat32' } }, AddVoter: { record: { principal: 'principal' } }, RemoveVoter: { record: { principal: 'principal' } }, Transfer: { record: { new_owner: 'principal' } }, WasmDeploy: { record: { target: 'text', source_path: 'text' } }, DeployMode: { record: { mode: 'text' } }, EvmDeploy: { record: { source_path: 'text', gas_limit: 'nat64' } } } };
  const VOTE = { variant: { Approve: 'null', Reject: 'null', Object: 'null' } };
  const describe = c => {
    const [kind, v] = Object.entries(c)[0];
    return kind === 'RequiredVotes' ? 'require ' + v.k + ' approval' + (v.k === 1 ? '' : 's') + ' per commit'
      : kind === 'AddVoter' ? 'add voter ' + short(v.principal)
      : kind === 'RemoveVoter' ? 'remove voter ' + short(v.principal)
      : kind === 'Transfer' ? 'offer the repository to ' + short(v.new_owner) + ', theirs once they accept (takes the owner\'s approval as well as the votes)'
      : kind === 'WasmDeploy' ? 'deploy ' + v.source_path + ' into ' + short(v.target)
      : kind === 'DeployMode' ? 'install mode ' + v.mode + (v.mode === 'reinstall' ? ' (WIPES the target\'s state on every deploy)' : '')
      : kind === 'EvmDeploy' ? 'deploy ' + v.source_path + ' to the EVM chain, gas limit ' + v.gas_limit
      : JSON.stringify(c);
  };
  const count = p => p.approvals + ' approve' + (p.objections ? ', ' + p.objections + ' object: net ' + (p.approvals - p.objections) : '') + ' of ' + p.required + ' required';
  async function governancePanel(repo, info, isOwner) {
    const canVote = me && (info.owner === me || info.members.some(m => m.principal === me && m.role === 'voter'));
    let html = '<div class="panel"><h3>governance</h3>';
    if (!info.governed) {
      html += '<p>not governed: the owner controls the app canister alongside ic-git, and can change its code or this repo\'s policy without a vote.</p>';
      if (isOwner && info.app_canister) {
        // The one-way step, behind the same typed guard as a reinstall.
        html += '<button id="btn-govern" class="danger" type="button"' + (info.required_votes ? '' : ' disabled title="set required votes to 1 or more first"') + '>govern this backend...</button>' +
          (info.required_votes ? '' : ' <span class="muted">set required votes to 1 or more first</span>') +
          '<div id="box-govern" class="confirm" hidden><p class="bad"><b>This cannot be undone.</b> ic-git becomes the ONLY controller of app canister ' + esc(info.app_canister) + ' and you are removed: from then on its code changes only by a commit the voters approve (' + info.required_votes + ' of ' + (1 + info.members.filter(m => m.role === 'voter').length) + ' today). The required votes, the voters, the owner and what deploys become votes too, and the required votes can never go back to 0. A broken backend is then fixed by an approved commit, not by you directly.</p>' +
          '<p>Type the repository name <b>' + esc(repo) + '</b> to confirm: <input id="in-govern" autocomplete="off"> <button id="go-govern" class="danger" type="button" disabled>govern now</button> <button id="cancel-govern" type="button">cancel</button></p><p id="govern-st" class="status"></p></div>';
      } else if (isOwner) {
        html += '<p class="muted">create the app canister first; governing hands its control to ic-git alone.</p>';
      }
      return html + '</div>';
    }
    html += '<p><b>governed</b>: app canister <span class="oid">' + esc(info.app_canister) + '</span> is controlled by ic-git alone, so it runs only commits the voters approve, ' + info.required_votes + ' of ' + (1 + info.members.filter(m => m.role === 'voter').length) + '. Changing that policy, the voters, the owner, or what deploys is itself a vote under it.</p>';
    let props = [];
    try { props = await get(encodeURIComponent(repo) + '/proposals'); } catch (e) { html += '<p class="muted">proposals could not be read: ' + esc(e.message) + '</p>'; }
    // Each row carries its change: the ballot buttons cast on exactly what
    // the row shows, not on whatever a later read of the list puts at the
    // same index after another voter's ballot applied one.
    html += props.length ? '<table><tr><th>proposed change</th><th>count</th><th>ballots</th>' + (canVote ? '<th></th>' : '') + '</tr>' + props.map(p =>
      '<tr><td>' + esc(describe(p.change)) + '</td><td>' + esc(count(p)) + '</td><td>' + p.ballots.map(b => '<span class="oid" title="' + esc(b.principal) + '">' + esc(short(b.principal)) + '</span> ' + (b.decision === 'object' ? '<span class="objection">objects' + (b.reason ? ': ' + esc(b.reason) : '') + '</span>' : esc(b.decision + (b.reason ? ' (' + b.reason + ')' : '')))).join('<br>') + '</td>' +
      (canVote ? '<td><form class="f-prop" data-change="' + esc(JSON.stringify(p.change)) + '"><button data-v="Approve">approve</button><button data-v="Reject">reject</button><textarea name="reason" maxlength="1024" placeholder="reason, required to object"></textarea><button data-v="Object">object</button></form></td>' : '') + '</tr>').join('') + '</table><p id="prop-st" class="status"></p>'
      : '<p class="muted">no pending policy changes.</p>';
    if (canVote) html += '<form id="f-propose"><select name="kind"><option value="RequiredVotes">required votes</option><option value="AddVoter">add voter</option><option value="RemoveVoter">remove voter</option><option value="Transfer">transfer to</option><option value="WasmDeploy">deploy path (into the app canister)</option><option value="DeployMode">install mode</option><option value="EvmDeploy">EVM deploy (path, then gas limit)</option></select><input name="value" placeholder="value"><textarea name="reason" maxlength="1024" placeholder="reason (optional)"></textarea><button>propose and approve</button></form><p id="f-propose-st" class="status"></p>';
    return html + '</div>';
  }
  function governanceWire(repo, info) {
    const box = document.getElementById('box-govern'), inp = document.getElementById('in-govern'), go = document.getElementById('go-govern'), btn = document.getElementById('btn-govern'), cancel = document.getElementById('cancel-govern');
    if (btn) btn.onclick = () => { box.hidden = false; inp.value = ''; go.disabled = true; inp.focus(); };
    if (cancel) cancel.onclick = () => { box.hidden = true; };
    if (inp) inp.oninput = () => { go.disabled = inp.value.trim() !== repo; };
    if (go) go.onclick = async () => {
      if (inp.value.trim() !== repo) return;
      go.disabled = true; btn.disabled = true;
      status('govern-st', 'waiting for wallet...', true);
      try { const id = await write('govern_app_canister', ['text'], [repo]); status('govern-st', 'governed: ' + id + ' is now controlled by ic-git alone', true); setTimeout(() => location.reload(), 1200); }
      catch (e) { status('govern-st', e.message, false); btn.disabled = false; }
    };
    const change = (kind, value) => {
      value = value.trim();
      if (kind === 'RequiredVotes') { const k = Number(value); if (!(Number.isInteger(k) && k >= 1)) throw new Error('required votes is a whole number, 1 or more'); return { RequiredVotes: { k } }; }
      if (kind === 'AddVoter' || kind === 'RemoveVoter') { if (!value) throw new Error('enter the voter\'s principal'); return { [kind]: { principal: value } }; }
      if (kind === 'Transfer') { if (!value) throw new Error('enter the new owner\'s principal'); return { Transfer: { new_owner: value } }; }
      if (kind === 'WasmDeploy') { if (!value) throw new Error('enter the path in the commit, e.g. app.wasm'); return { WasmDeploy: { target: info.app_canister, source_path: value } }; }
      if (kind === 'DeployMode') { if (value !== 'upgrade' && value !== 'reinstall') throw new Error('the install mode is upgrade or reinstall'); return { DeployMode: { mode: value } }; }
      if (kind === 'EvmDeploy') { const [path, gas] = value.split(/\s+/); if (!path || !/^[0-9]+$/.test(gas || '')) throw new Error('enter the path in the commit and the gas limit, e.g. token.hex 3000000'); return { EvmDeploy: { source_path: path, gas_limit: BigInt(gas) } }; }
      throw new Error('unknown change');
    };
    const cast = async (st, c, decision, reason) => {
      status(st, 'waiting for wallet...', true);
      const r = await write('propose_policy_change', ['text', CHANGE, VOTE, { opt: 'text' }], [repo, c, { [decision]: null }, reason || null]);
      status(st, 'recorded: ' + count(r) + (r.reached ? '; applied' : ''), true);
      setTimeout(() => location.reload(), 800);
    };
    onsubmit('f-propose', async v => { await cast('f-propose-st', change(v.kind, v.value), 'Approve', v.reason.trim()); return 'recorded'; });
    document.querySelectorAll('form.f-prop').forEach(f => f.querySelectorAll('button').forEach(b => { b.onclick = async e => {
      e.preventDefault();
      const decision = b.dataset.v, reason = f.reason.value.trim();
      if (decision === 'Object' && !reason) { status('prop-st', 'an objection needs a reason', false); f.reason.focus(); return; }
      try { await cast('prop-st', JSON.parse(f.dataset.change), decision, reason); } catch (err) { status('prop-st', err.message, false); }
    }; }));
  }

  async function commitPanel(repo, oid) {
    const [info, v] = await Promise.all([get(encodeURIComponent(repo) + '/info'), get(encodeURIComponent(repo) + '/votes/' + oid)]);
    // A count with its verb: "1 approves", "2 approve".
    const n = (k, word) => k + ' ' + word + (k === 1 ? 's' : '');
    const canVote = me && (info.owner === me || info.members.some(m => m.principal === me && m.role === 'voter'));
    // A ballot outlives its caster's place in the policy, and stops counting:
    // it is listed, muted and marked, and kept out of the objections above.
    const objections = v.ballots.filter(b => b.decision === 'object' && b.counts);
    const row = b => '<tr' + (b.counts ? '' : ' class="muted"') + '><td class="oid">' + esc(b.principal) + '</td><td' + (b.decision === 'object' && b.counts ? ' class="objection"' : '') + '>' + esc(b.decision) + (b.counts ? '' : ' (not counted: no longer a voter)') + '</td><td>' + (b.reason ? esc(b.reason) : '') + '</td></tr>';
    let html = '<div class="panel"><h3>approvals</h3>';
    // Objections first, with their reasons: they are what the other voters
    // are being asked to read before adding an approval.
    if (objections.length) html += '<p class="objection">' + objections.length + ' objection' + (objections.length === 1 ? '' : 's') + ':</p><table>' + objections.map(row).join('') + '</table>';
    // An objection counts -1: "3 approve, 1 objects: net 2 of 3 required".
    html += '<p>' + n(v.approvals, 'approve') + (v.objections ? ', ' + n(v.objections, 'object') + ': net ' + (v.approvals - v.objections) : '') + ' of ' + v.required + ' required' + (v.required && !v.reached ? ' (not approved)' : '') + '</p>';
    if (v.ballots.length) html += '<table>' + v.ballots.map(row).join('') + '</table>';
    if (canVote) html += '<form id="f-vote"><button data-v="Approve">approve</button><button data-v="Reject">reject</button><textarea name="reason" maxlength="1024" placeholder="reason, required to object (up to 1 KB)"></textarea><button data-v="Object">object</button></form><p id="f-vote-st" class="status"></p>';
    html += '</div>';
    setTimeout(() => {
      const f = document.getElementById('f-vote');
      if (!f) return;
      f.querySelectorAll('button').forEach(b => { b.onclick = async e => {
        e.preventDefault();
        const decision = b.dataset.v, reason = f.reason.value.trim();
        if (decision === 'Object' && !reason) { status('f-vote-st', 'an objection needs a reason', false); f.reason.focus(); return; }
        // The limit is in bytes of UTF-8, which maxlength does not count:
        // refuse here rather than after the wallet has signed.
        if (new TextEncoder().encode(reason).length > 1024) { status('f-vote-st', 'the reason is over 1 KB', false); f.reason.focus(); return; }
        status('f-vote-st', 'waiting for wallet...', true);
        try {
          const r = await write('cast_ballot', ['text', 'text', { variant: { Approve: 'null', Reject: 'null', Object: 'null' } }, { opt: 'text' }], [repo, oid, { [decision]: null }, reason || null]);
          status('f-vote-st', 'recorded: ' + r.approvals + ' approve' + (r.objections ? ', ' + r.objections + ' object: net ' + (r.approvals - r.objections) : '') + ' of ' + r.required + (r.reached ? ', approved' : ''), true);
          setTimeout(() => location.reload(), 800);
        } catch (err) { status('f-vote-st', err.message, false); }
      }; });
    }, 0);
    return html;
  }

  async function mount(view, repo, oid) {
    paintWallet();
    const main = document.getElementById('main');
    try {
      await ready();
      const html = view === 'repos' ? await reposPanel() : view === 'repo' ? await repoPanel(repo) : await commitPanel(repo, oid);
      main.insertAdjacentHTML('beforeend', html);
    } catch (e) { main.insertAdjacentHTML('beforeend', '<p class="muted">console unavailable: ' + esc(e.message) + '</p>'); }
  }
  paintWallet();
  return { mount };
})();
// === end console ===
</script>
</body>
</html>
