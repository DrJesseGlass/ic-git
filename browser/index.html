<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ic-git</title>
<!--
  ic-git repo browser. One file, no external resources: every byte that runs
  is inside the blob the ProvenanceRegistry attests, so a verifier that
  matches this file's hash has covered the whole app (VISION.md section 2,
  "SRI hashes"). Git reads go to the /api routes of the git canister, which
  serves this page, at its own host or at a domain of the page's own; the
  tenancy reads go to the authority's (the same canister until the cut of
  docs/CANISTER_SPLIT.md, ic-git itself after it); the ledger balances and a
  few config reads are anonymous queries to the IC HTTP API. It asks a
  wallet to sign only at a domain of its own (docs/TENANCY.md, "Console").
-->
<style>
  :root { --fg:#1c1c1c; --muted:#6b6b6b; --bg:#fafaf8; --line:#e2e0da; --link:#0b57a4; --code:#f1efe9; --plus:#1a7f37; --minus:#b3261e; --added:#dff3e2; --removed:#fbe3e1; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e4dd; --muted:#9a978f; --bg:#161615; --line:#2c2b28; --link:#7fb3ea; --code:#1f1e1c; --plus:#57b96b; --minus:#f0796f; --added:#1b3322; --removed:#40201e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { border-bottom:1px solid var(--line); padding:.7rem 1rem; display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0; }
  header .prov { color:var(--muted); font-size:.85rem; margin-left:auto; }
  main { max-width: 1040px; margin: 0 auto; padding: 1rem; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.88em; }
  pre { background:var(--code); border:1px solid var(--line); border-radius:6px; padding:.8rem 1rem; overflow-x:auto; }
  pre.src { counter-reset: ln; padding-left:0; }
  pre.src span.l { display:block; padding-left:4.2em; position:relative; white-space:pre; }
  pre.src span.l:empty::after { content:"\00a0"; }
  pre.src span.l::before { counter-increment: ln; content: counter(ln); position:absolute; left:0; width:3.2em; text-align:right; color:var(--muted); user-select:none; }
  table { border-collapse: collapse; width:100%; }
  td, th { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:.85rem; }
  .muted { color: var(--muted); }
  .crumbs { margin:.2rem 0 1rem; }
  .crumbs > * + *::before { content:" / "; color:var(--muted); }
  .row { display:flex; gap:1.5rem; flex-wrap:wrap; align-items:baseline; margin-bottom:.6rem; }
  .tabs a { margin-right:1rem; }
  .tabs a.on { font-weight:600; color:var(--fg); }
  .oid { font-family: ui-monospace, Menlo, monospace; font-size:.85em; }
  .err { color:#b3261e; }
  select { font: inherit; padding:.15rem .3rem; }
  .commit .msg { white-space: pre-wrap; margin:.2rem 0 0; }
  .commit { padding:.5rem 0; border-bottom:1px solid var(--line); }
  .panel { border:1px solid var(--line); border-radius:8px; padding:.8rem 1rem; margin:1rem 0; background:var(--code); }
  .panel h3 { margin:0 0 .5rem; font-size:.95rem; }
  .panel form { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin:.4rem 0; }
  .panel input, .panel textarea { font:inherit; padding:.25rem .4rem; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); min-width:12rem; }
  .panel button, header button { font:inherit; padding:.25rem .7rem; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); cursor:pointer; }
  .panel button:hover, header button:hover { border-color:var(--link); }
  .panel .status { margin:.4rem 0 0; min-height:1.2em; }
  .panel textarea { min-width:20rem; min-height:2.4em; resize:vertical; }
  .panel .objection { color:#b3261e; }
  .panel .ok { color:#1a7f37; } .panel .bad { color:#b3261e; }
button.danger { border-color:#b3261e; color:#b3261e; }
button.danger:disabled { opacity:.45; cursor:not-allowed; }
.confirm { border:1px solid #b3261e; border-radius:4px; padding:.6rem .8rem; margin:.5rem 0; }
.confirm input { width:16rem; }
  .tok { user-select:all; }
  .plus { color:var(--plus); } .minus { color:var(--minus); }
  details.file { border:1px solid var(--line); border-radius:6px; margin:.6rem 0; }
  details.file > summary { padding:.4rem .7rem; cursor:pointer; background:var(--code); border-radius:6px; display:flex; gap:.7rem; align-items:baseline; flex-wrap:wrap; }
  details.file > summary::before { content:"\25B8"; color:var(--muted); }
  details.file[open] > summary::before { content:"\25BE"; }
  details.file[open] > summary { border-bottom:1px solid var(--line); border-radius:6px 6px 0 0; }
  details.file .st { font-size:.8rem; min-width:4.2rem; }
  details.file .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.88em; overflow-wrap:anywhere; }
  details.file .count { margin-left:auto; font-size:.85rem; white-space:nowrap; }
  details.file .body { overflow-x:auto; }
  details.file .body > p { margin:.5rem .7rem; }
  table.diff { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.82rem; line-height:1.45; }
  table.diff td { padding:0 .6rem; border:0; white-space:pre; }
  table.diff td.n { width:1%; text-align:right; color:var(--muted); user-select:none; }
  table.diff tr.add td { background:var(--added); } table.diff tr.del td { background:var(--removed); }
  table.diff tr.hunk td { background:var(--code); color:var(--muted); padding-top:.15rem; padding-bottom:.15rem; }
</style>

<body>
<header>
  <h1><a href="#/">ic-git</a></h1>
  <span class="muted">a git remote on the Internet Computer</span>
  <span class="prov" id="prov"></span>
  <span id="wallet"></span>
</header>
<main id="main"><p class="muted">loading&hellip;</p></main>
<script>
// === candid ===
// Minimal Candid, CBOR, and IC certificate handling for the console. Enough of
// each for the calls this page makes and the replies it reads; tested against
// encodings produced by the Rust candid crate (tools/console-codec-test.mjs).
const IC = (() => {
  'use strict';
  const te = new TextEncoder(), td = new TextDecoder();
  const big = v => typeof v === 'bigint' ? v : BigInt(v);
  function uleb(n) { n = big(n); const out = []; do { let b = Number(n & 0x7fn); n >>= 7n; if (n) b |= 0x80; out.push(b); } while (n); return out; }
  function sleb(n) { n = big(n); const out = []; for (;;) { const b = Number(n & 0x7fn); n >>= 7n; const sign = b & 0x40; if ((n === 0n && !sign) || (n === -1n && sign)) { out.push(b); return out; } out.push(b | 0x80); } }
  function idlHash(name) { let h = 0; for (const c of te.encode(name)) h = (Math.imul(h, 223) + c) >>> 0; return h; }
  const fieldId = n => /^[0-9]+$/.test(n) ? Number(n) : idlHash(n);
  const PRIM = { null: -1, bool: -2, nat: -3, int: -4, nat8: -5, nat16: -6, nat32: -7, nat64: -8, int8: -9, int16: -10, int32: -11, int64: -12, float32: -13, float64: -14, text: -15, reserved: -16, empty: -17, principal: -24 };

  // --- principals ---
  const CRC = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; } return t; })();
  function crc32(bytes) { let c = 0xffffffff; for (const b of bytes) c = CRC[(c ^ b) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
  const B32 = 'abcdefghijklmnopqrstuvwxyz234567';
  function b32enc(bytes) { let bits = 0, val = 0, out = ''; for (const b of bytes) { val = (val << 8) | b; bits += 8; while (bits >= 5) { out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; } } if (bits) out += B32[(val << (5 - bits)) & 31]; return out; }
  function b32dec(str) { let bits = 0, val = 0; const out = []; for (const ch of str) { const i = B32.indexOf(ch); if (i < 0) throw new Error('bad base32'); val = (val << 5) | i; bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } } return Uint8Array.from(out); }
  function principalToText(bytes) { const c = crc32(bytes); const all = new Uint8Array(4 + bytes.length); all.set([c >>> 24, (c >>> 16) & 255, (c >>> 8) & 255, c & 255]); all.set(bytes, 4); return b32enc(all).match(/.{1,5}/g).join('-'); }
  function principalFromText(text) { const raw = b32dec(text.toLowerCase().replace(/-/g, '')); const bytes = raw.slice(4); const c = crc32(bytes); if (((raw[0] << 24) | (raw[1] << 16) | (raw[2] << 8) | raw[3]) >>> 0 !== c) throw new Error('bad principal checksum'); return bytes; }

  // --- encoder ---
  // Types: a primitive name, 'blob', {opt: T}, {vec: T}, {record: {field: T}}, {variant: {tag: T}}.
  function encode(types, values) {
    const table = [], memo = new Map();
    function idx(t) {
      if (typeof t === 'string') { if (t === 'blob') return idx({ vec: 'nat8' }); if (!(t in PRIM)) throw new Error('unknown type ' + t); return PRIM[t]; }
      const key = JSON.stringify(t); if (memo.has(key)) return memo.get(key);
      const i = table.length; table.push(null); memo.set(key, i);
      let body;
      if (t.opt !== undefined) body = [...sleb(-18), ...sleb(idx(t.opt))];
      else if (t.vec !== undefined) body = [...sleb(-19), ...sleb(idx(t.vec))];
      else if (t.record || t.variant) {
        const fs = Object.entries(t.record || t.variant).map(([n, ft]) => [fieldId(n), idx(ft)]).sort((a, b) => a[0] - b[0]);
        body = [...sleb(t.record ? -20 : -21), ...uleb(fs.length)];
        for (const [id, ti] of fs) body.push(...uleb(id), ...sleb(ti));
      } else throw new Error('bad type');
      table[i] = body; return i;
    }
    function val(t, v, out) {
      if (t === 'blob') t = { vec: 'nat8' };
      if (typeof t === 'string') {
        switch (t) {
          case 'null': return;
          case 'bool': out.push(v ? 1 : 0); return;
          case 'nat': out.push(...uleb(v)); return;
          case 'int': out.push(...sleb(v)); return;
          case 'nat8': out.push(Number(v) & 255); return;
          case 'nat32': { const n = Number(v) >>> 0; out.push(n & 255, (n >>> 8) & 255, (n >>> 16) & 255, n >>> 24); return; }
          case 'nat64': { let n = big(v); for (let i = 0; i < 8; i++) { out.push(Number(n & 255n)); n >>= 8n; } return; }
          case 'text': { const b = te.encode(v); out.push(...uleb(b.length), ...b); return; }
          case 'principal': { const b = typeof v === 'string' ? principalFromText(v) : v; out.push(1, ...uleb(b.length), ...b); return; }
          default: throw new Error('cannot encode ' + t);
        }
      }
      if (t.opt !== undefined) { if (v === null || v === undefined) out.push(0); else { out.push(1); val(t.opt, v, out); } return; }
      if (t.vec !== undefined) { const arr = v instanceof Uint8Array ? Array.from(v) : v; out.push(...uleb(arr.length)); for (const x of arr) val(t.vec, x, out); return; }
      if (t.record) { for (const [n] of Object.entries(t.record).map(([n, ft]) => [n, ft]).sort((a, b) => fieldId(a[0]) - fieldId(b[0]))) val(t.record[n], v[n], out); return; }
      if (t.variant) { const names = Object.keys(t.variant).sort((a, b) => fieldId(a) - fieldId(b)); const tag = Object.keys(v)[0]; const i = names.indexOf(tag); if (i < 0) throw new Error('bad variant ' + tag); out.push(...uleb(i)); val(t.variant[tag], v[tag], out); return; }
      throw new Error('bad type');
    }
    const tis = types.map(idx);
    const out = [0x44, 0x49, 0x44, 0x4c, ...uleb(table.length)];
    for (const body of table) out.push(...body);
    out.push(...uleb(tis.length));
    for (const ti of tis) out.push(...sleb(ti));
    types.forEach((t, i) => val(t, values[i], out));
    return Uint8Array.from(out);
  }

  // --- decoder ---
  const NAMES = {}; for (const n of ['Ok', 'Err', 'Writer', 'Voter', 'principal', 'role', 'balance', 'deposited', 'spent', 'created_ns', 'canister_id', 'owner', 'subaccount', 'message', 'error_code', 'InsufficientFunds', 'InsufficientAllowance', 'GenericError', 'BadFee', 'expected_fee', 'allowance', 'TooOld', 'TemporarilyUnavailable', 'Duplicate', 'duplicate_of', 'CreatedInFuture', 'ledger_time', 'Expired', 'AllowanceChanged', 'current_allowance', 'BadBurn', 'min_burn_amount', 'target', 'source_path', 'mode', 'upgrade', 'reinstall', 'root', 'commit', 'ok', 'wasm_len', 'wasm_sha256', 'gas_limit', 'id', 'repo', 'minted_by', 'expires_ns', 'key', 'require_signed_push', 'tx_hash', 'nonce', 'from', 'contract_address', 'data', 'xdr_permyriad_per_icp', 'timestamp_seconds', 'certificate', 'hash_tree', 'block_index', 'who', 'e8s', 'at_ns', 'last_error', 'ledger', 'cmc', 'approvals', 'objections', 'required', 'reached', 'governed', 'counts', 'change', 'ballots', 'RequiredVotes', 'AddVoter', 'RemoveVoter', 'Transfer', 'WasmDeploy', 'DeployMode', 'EvmDeploy', 'k', 'new_owner', 'domains', 'available', 'withdrawn', 'reserved', 'markup', 'credited', 'gas_used', 'effective_gas_price', 'cost', 'direction', 'Deposit', 'Withdrawal', 'amount', 'fee', 'uncertain', 'in_flight']) NAMES[idlHash(n)] = n;
  function decode(bytes) {
    let pos = 0;
    const u8 = () => bytes[pos++];
    const rUleb = () => { let r = 0n, sh = 0n, b; do { b = u8(); r |= BigInt(b & 0x7f) << sh; sh += 7n; } while (b & 0x80); return r; };
    const rSleb = () => { let r = 0n, sh = 0n, b; do { b = u8(); r |= BigInt(b & 0x7f) << sh; sh += 7n; } while (b & 0x80); if (b & 0x40) r -= 1n << sh; return r; };
    if (td.decode(bytes.slice(0, 4)) !== 'DIDL') throw new Error('not candid'); pos = 4;
    const table = []; const n = Number(rUleb());
    for (let i = 0; i < n; i++) {
      const op = Number(rSleb());
      if (op === -18 || op === -19) table.push({ op, of: Number(rSleb()) });
      else if (op === -20 || op === -21) { const m = Number(rUleb()); const fields = []; for (let j = 0; j < m; j++) { const id = Number(rUleb()); fields.push({ id, t: Number(rSleb()) }); } table.push({ op, fields }); }
      else if (op === -22) { rUleb(); const a = Number(rUleb()); for (let j = 0; j < a; j++) rSleb(); const r = Number(rUleb()); for (let j = 0; j < r; j++) rSleb(); const ann = Number(rUleb()); pos += ann; table.push({ op }); }
      else throw new Error('unsupported type op ' + op);
    }
    const argc = Number(rUleb()); const types = []; for (let i = 0; i < argc; i++) types.push(Number(rSleb()));
    const name = id => NAMES[id] !== undefined ? NAMES[id] : (id < 256 ? String(id) : '_' + id);
    function value(t) {
      if (t < 0) switch (t) {
        case -1: return null;
        case -2: return u8() !== 0;
        case -3: return rUleb();
        case -4: return rSleb();
        case -5: return u8();
        case -6: return u8() | (u8() << 8);
        case -7: return (u8() | (u8() << 8) | (u8() << 16) | (u8() << 24)) >>> 0;
        case -8: { let r = 0n; for (let i = 0; i < 8; i++) r |= BigInt(u8()) << BigInt(8 * i); return r; }
        case -12: { let r = 0n; for (let i = 0; i < 8; i++) r |= BigInt(u8()) << BigInt(8 * i); return BigInt.asIntN(64, r); }
        case -15: { const l = Number(rUleb()); const s = td.decode(bytes.slice(pos, pos + l)); pos += l; return s; }
        case -16: return null;
        case -24: { if (u8() !== 1) throw new Error('opaque principal'); const l = Number(rUleb()); const b = bytes.slice(pos, pos + l); pos += l; return principalToText(b); }
        default: throw new Error('cannot decode type ' + t);
      }
      const e = table[t];
      if (e.op === -18) return u8() ? value(e.of) : null;
      if (e.op === -19) { const l = Number(rUleb()); if (e.of === -5) { const b = bytes.slice(pos, pos + l); pos += l; return b; } const a = []; for (let i = 0; i < l; i++) a.push(value(e.of)); return a; }
      if (e.op === -20) { const o = {}; for (const f of e.fields) o[name(f.id)] = value(f.t); return o; }
      if (e.op === -21) { const i = Number(rUleb()); const f = e.fields[i]; return { [name(f.id)]: value(f.t) }; }
      throw new Error('cannot decode');
    }
    return types.map(value);
  }

  // --- CBOR: decoder for certificates and content maps, encoder for query envelopes ---
  function cbor(bytes) {
    let pos = 0;
    function item() {
      const ib = bytes[pos++], mt = ib >> 5, ai = ib & 31;
      let n;
      if (ai < 24) n = ai; else if (ai === 24) n = bytes[pos++]; else if (ai === 25) { n = (bytes[pos] << 8) | bytes[pos + 1]; pos += 2; }
      else if (ai === 26) { n = ((bytes[pos] << 24) >>> 0) + ((bytes[pos + 1] << 16) | (bytes[pos + 2] << 8) | bytes[pos + 3]); pos += 4; }
      else if (ai === 27) { n = 0n; for (let i = 0; i < 8; i++) n = (n << 8n) | BigInt(bytes[pos++]); if (n <= BigInt(Number.MAX_SAFE_INTEGER)) n = Number(n); }
      else if (ai === 31) n = -1; else throw new Error('cbor: bad ai');
      switch (mt) {
        case 0: return n;
        case 1: return typeof n === 'bigint' ? -1n - n : -1 - n;
        case 2: { const b = bytes.slice(pos, pos + Number(n)); pos += Number(n); return b; }
        case 3: { const s = td.decode(bytes.slice(pos, pos + Number(n))); pos += Number(n); return s; }
        case 4: { const a = []; if (n === -1) { while (bytes[pos] !== 0xff) a.push(item()); pos++; } else for (let i = 0; i < Number(n); i++) a.push(item()); return a; }
        case 5: { const o = {}; const cnt = n === -1 ? Infinity : Number(n); for (let i = 0; i < cnt; i++) { if (n === -1 && bytes[pos] === 0xff) { pos++; break; } const k = item(); o[typeof k === 'string' ? k : String(k)] = item(); } return o; }
        case 6: return item();
        case 7: if (ai === 20) return false; if (ai === 21) return true; if (ai === 22 || ai === 23) return null; throw new Error('cbor: unsupported simple');
        default: throw new Error('cbor: bad major type');
      }
    }
    return item();
  }
  // CBOR encoder, for query envelopes: non-negative ints, text, bytes,
  // arrays and string-keyed maps, wrapped in the self-describing tag.
  function cborEnc(v) {
    const out = [];
    const head = (mt, n) => { n = big(n); if (n < 24n) out.push((mt << 5) | Number(n)); else if (n < 256n) out.push((mt << 5) | 24, Number(n)); else if (n < 65536n) out.push((mt << 5) | 25, Number(n >> 8n), Number(n & 255n)); else if (n < 4294967296n) out.push((mt << 5) | 26, Number(n >> 24n) & 255, Number(n >> 16n) & 255, Number(n >> 8n) & 255, Number(n & 255n)); else if (n < 18446744073709551616n) { out.push((mt << 5) | 27); for (let i = 7n; i >= 0n; i--) out.push(Number((n >> (8n * i)) & 255n)); } else throw new Error('cbor: over 64 bits'); };
    function item(v) {
      if (typeof v === 'number' || typeof v === 'bigint') { if (v < 0) throw new Error('cbor: negative'); head(0, v); }
      else if (typeof v === 'string') { const b = te.encode(v); head(3, b.length); out.push(...b); }
      else if (v instanceof Uint8Array) { head(2, v.length); out.push(...v); }
      else if (Array.isArray(v)) { head(4, v.length); v.forEach(item); }
      else if (v && typeof v === 'object') { const ks = Object.keys(v); head(5, ks.length); for (const k of ks) { item(k); item(v[k]); } }
      else throw new Error('cbor: cannot encode ' + typeof v);
    }
    out.push(0xd9, 0xd9, 0xf7);
    item(v);
    return Uint8Array.from(out);
  }

  // --- queries ---
  // An anonymous query straight to the IC HTTP API, for reads that need no
  // signature (ledger balances). The reply is taken as the boundary node
  // returns it, without checking node signatures, like the /api reads.
  // Served by a local replica (<id>.localhost or <id>.raw.localhost), the
  // queries go to that replica's gateway, which answers /api/v2 on the same
  // origin; otherwise to mainnet. Without this a local deployment's console
  // asked mainnet about local canister ids and every query-backed panel
  // failed. The ICP ledger, cycles ledger and CMC keep their mainnet ids on
  // a replica started with --system-canisters.
  const LOCAL = typeof location !== 'undefined' && /(^|\.)localhost$/.test(location.hostname);
  const API = LOCAL ? location.origin : 'https://icp-api.io', QUERY_TIMEOUT_MS = 15_000;
  async function query(canisterId, method, types, values) {
    const content = { request_type: 'query', sender: Uint8Array.of(4), canister_id: principalFromText(canisterId), method_name: method, arg: encode(types, values), ingress_expiry: BigInt(Date.now() + 240_000) * 1_000_000n };
    const r = await fetch(API + '/api/v2/canister/' + canisterId + '/query', { method: 'POST', headers: { 'Content-Type': 'application/cbor' }, body: cborEnc({ content }), signal: AbortSignal.timeout(QUERY_TIMEOUT_MS) });
    if (!r.ok) throw new Error(method + ': HTTP ' + r.status);
    const res = cbor(new Uint8Array(await r.arrayBuffer()));
    if (res.status !== 'replied') {
      // The reject's codes ride along, for a caller that tells one reject
      // from another (Routes: a canister without the method).
      const e = new Error(method + ' rejected: ' + (res.reject_message || res.status));
      e.rejectCode = res.reject_code; e.errorCode = res.error_code;
      throw e;
    }
    return decode(res.reply.arg);
  }

  // --- certificates ---
  const sha256 = async b => new Uint8Array(await crypto.subtle.digest('SHA-256', b));
  const cmp = (a, b) => { for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return a[i] - b[i]; return a.length - b.length; };
  const same = (a, b) => cmp(a, b) === 0;
  // Representation-independent hash of a call's content map: the request id.
  async function requestId(content) {
    const entries = [];
    for (const [k, v] of Object.entries(content)) {
      let vb;
      if (typeof v === 'string') vb = te.encode(v);
      else if (v instanceof Uint8Array) vb = v;
      else if (typeof v === 'number' || typeof v === 'bigint') vb = Uint8Array.from(uleb(v));
      else throw new Error('request id: unsupported field ' + k);
      entries.push([await sha256(te.encode(k)), await sha256(vb)]);
    }
    entries.sort((a, b) => cmp(a[0], b[0]));
    const all = []; for (const [kh, vh] of entries) all.push(...kh, ...vh);
    return sha256(Uint8Array.from(all));
  }
  // Hash-tree lookup: [0] empty, [1,l,r] fork, [2,label,sub] labeled, [3,leaf], [4,pruned].
  function flatten(t, out) { if (t[0] === 1) { flatten(t[1], out); flatten(t[2], out); } else if (t[0] !== 0) out.push(t); return out; }
  function lookup(tree, path) {
    let node = tree;
    for (const label of path) {
      const lb = typeof label === 'string' ? te.encode(label) : label;
      const asBytes = l => typeof l === 'string' ? te.encode(l) : l;
      const hit = flatten(node, []).find(n => n[0] === 2 && same(asBytes(n[1]), lb));

  // Trusts the wallet's certificate rather than verifying the BLS signature
  // (docs/TENANCY.md, "Console"); the wallet is the party that just signed.
  async function callResult(res) {
    const content = cbor(b64dec(res.contentMap));
    const cert = cbor(b64dec(res.certificate));

    const reply = lookup(cert.tree, ['request_status', id, 'reply']);
    if (reply) return decode(reply);

    const st = status ? td.decode(status) : 'unknown';

  return { encode, decode, cbor, cborEnc, query, requestId, lookup, callResult, principalToText, principalFromText, idlHash, b64enc, b64dec, hex };
})();

<script>
// === diff ===
// The lines that changed between two versions of a file, for the commit
// view. The canister says which files differ and names the blobs
// (/api/<repo>/diff, crates/git/src/diff.rs); the page fetches the two and
// compares them here, so what is shown is worked out from the bytes the
// page was served. Myers' algorithm (a shortest edit script, as git's
// default is), then git's unified hunks around the changes. Where two
// shortest scripts exist git may pick another, and it slides a hunk to
// the nicer of two equal places, which this does not: the lines marked
// can differ from `git diff`'s while saying the same change. Checked by
// tools/browser-diff-test.mjs.
const Diff = (() => {
  'use strict';
  // A text as its lines, and whether the last one ends without a newline.
  function split(text) {
    if (text === '') return { lines: [], noeol: false };
    const lines = text.split('\n');
    const noeol = lines[lines.length - 1] !== '';
    if (!noeol) lines.pop();
    return { lines, noeol };
  }
  // A shortest edit script from a to b (arrays compared with ===), as
  // [op, i, j]: ' ' (a[i] is b[j]), '-' (a[i] goes, before b[j]) or '+'
  // (b[j] comes, before a[i]). Null when it takes more than maxD edits.
  function script(a, b, maxD) {
    const n = a.length, m = b.length;
    let pre = 0;
    while (pre < n && pre < m && a[pre] === b[pre]) pre++;
    let suf = 0;
    while (suf < n - pre && suf < m - pre && a[n - 1 - suf] === b[m - 1 - suf]) suf++;
    const N = n - pre - suf, M = m - pre - suf;
    const out = [];
    for (let i = 0; i < pre; i++) out.push([' ', i, i]);
    const tail = () => { for (let i = 0; i < suf; i++) out.push([' ', n - suf + i, m - suf + i]); return out; };
    // Lines only added or only taken away, a whole new file among them,
    // are their own shortest script, however many.
    if (!N || !M) {
      for (let i = 0; i < N; i++) out.push(['-', pre + i, pre]);
      for (let j = 0; j < M; j++) out.push(['+', pre, pre + j]);
      return tail();
    }
    const max = Math.min(N + M, maxD), off = max + 1;
    // v[off + k]: the furthest x reached on diagonal k (x - y = k). Each
    // round's diagonals, -d-1..d+1, are kept for the walk back.
    const v = new Int32Array(2 * max + 3), trace = [];
    let found = -1;
    for (let d = 0; d <= max && found < 0; d++) {
      trace.push(v.slice(off - d - 1, off + d + 2));
      for (let k = -d; k <= d; k += 2) {
        let x = (k === -d || (k !== d && v[off + k - 1] < v[off + k + 1])) ? v[off + k + 1] : v[off + k - 1] + 1;
        let y = x - k;
        while (x < N && y < M && a[pre + x] === b[pre + y]) { x++; y++; }
        v[off + k] = x;
        if (x >= N && y >= M) { found = d; break; }
      }
    }
    if (found < 0) return null;
    const mid = [];
    let x = N, y = M;
    for (let d = found; d > 0; d--) {
      const w = trace[d], at = k => w[k + d + 1], k = x - y;
      const pk = (k === -d || (k !== d && at(k - 1) < at(k + 1))) ? k + 1 : k - 1;
      const px = at(pk), py = px - pk;
      while (x > px && y > py) { x--; y--; mid.push([' ', pre + x, pre + y]); }
      if (pk === k + 1) { y--; mid.push(['+', pre + x, pre + y]); } else { x--; mid.push(['-', pre + x, pre + y]); }
    }
    while (x > 0 && y > 0) { x--; y--; mid.push([' ', pre + x, pre + y]); }
    for (let i = mid.length - 1; i >= 0; i--) out.push(mid[i]);
    return tail();
  }
  // git's unified hunks: each change with `ctx` lines around it, changes
  // no further apart than twice that in one hunk. A hunk is
  // { a, an, b, bn, lines }: a and b the first line on each side, from 1
  // (for a side with no lines in the hunk, the line before it, as in
  // "@@ -0,0 +1,3 @@"), and lines as [op, text, oldNo, newNo, bare], bare
  // for a last line with no newline after it. Null when the two are more
  // than maxD edits apart.
  function hunks(oldText, newText, ctx = 3, maxD = 2000) {
    const A = split(oldText), B = split(newText);
    // A line is its text, and for a last line whether a newline ends it.
    const ids = new Map();
    const key = S => S.lines.map((s, i) => {
      const k = (S.noeol && i === S.lines.length - 1 ? '1' : '0') + s;
      let id = ids.get(k);
      if (id === undefined) { id = ids.size; ids.set(k, id); }
      return id;
    });
    const ops = script(key(A), key(B), maxD);
    if (!ops) return null;
    const spans = [];
    let last = -1;
    ops.forEach((op, at) => {
      if (op[0] === ' ') return;
      if (!spans.length || at - last - 1 > 2 * ctx) spans.push({ start: Math.max(at - ctx, 0) });
      spans[spans.length - 1].end = Math.min(at + ctx, ops.length - 1);
      last = at;
    });
    return spans.map(h => {
      const lines = [];
      let an = 0, bn = 0, a0 = ops[h.start][1], b0 = ops[h.start][2];
      for (let at = h.start; at <= h.end; at++) {
        const [op, i, j] = ops[at];
        if (op !== '+' && !an++) a0 = i + 1;
        if (op !== '-' && !bn++) b0 = j + 1;
        const S = op === '+' ? B : A, at1 = op === '+' ? j : i;
        lines.push([op, S.lines[at1], op === '+' ? null : i + 1, op === '-' ? null : j + 1, S.noeol && at1 === S.lines.length - 1]);
      }
      return { a: a0, an, b: b0, bn, lines };
    });
  }
  // The hunk's header, as git writes it.
  const header = h => '@@ -' + h.a + (h.an === 1 ? '' : ',' + h.an) + ' +' + h.b + (h.bn === 1 ? '' : ',' + h.bn) + ' @@';
  return { split, script, hunks, header };
})();
// === end diff ===
</script>
<script>
// === routes ===
// Where the page is, and which canister answers what (docs/TENANCY.md,
// "Console"; docs/CANISTER_SPLIT.md, step 14c). A script of its own, ahead
// of the git browser and the console, which both use it.
//
// The page is served by the git canister, in one of two places:
// - on a canister's own host, <id>.raw.icp0.io (<id>.raw.localhost:4943 on
//   a replica), which every site that canister serves shares: any of them
//   can reach this page's window and storage, so the console asks no
//   wallet to sign there;
// - at a domain of its own (ic-git.com on mainnet), where the whole origin
//   is this page (docs/TENANCY.md, "Custom domains"). The canisters are
//   the pinned ones, and the git reads cross to the git canister's host.
// The git canister holds the objects, the refs, the sites and the push
// tokens; the authority, ic-git, holds everything else -- accounts,
// members, ballots, deploy configs, the registry writes -- and is what a
// deposit approves on a ledger. On mainnet both ids are pinned, as
// core/verifier.js pins them (tools/console-routes-test.mjs holds them to
// canister_ids.json): the canister a page approves as a spender must not be
// learned from the canister that served the page. On another canister's
// host (a local replica, another deployment) the serving canister is
// asked, through the git canister's get_authority; a canister without that
// method is the one-canister build and is the authority itself.
const Routes = (() => {
  'use strict';
  const AUTHORITY = 'umobs-yiaaa-aaaab-agyrq-cai', GIT = '34koz-jyaaa-aaaab-ahejq-cai';
  const PINNED = new Set([AUTHORITY, GIT]);
  // Where the console signs on mainnet: the pinned hosts send a user there.
  const HOME = 'https://ic-git.com';
  // The git canister's methods the console calls. Every other call, query
  // or write, is the authority's.
  const GIT_METHODS = new Set(['create_push_token', 'revoke_push_token_id', 'list_push_tokens', 'get_site']);
  const CANISTER_ID = /^([a-z0-9]{5}-)+[a-z0-9]{3}$/;
  const label = loc => loc.hostname.split('.')[0];
  // A canister's own host: the canister's id, then the gateway's domain.
  const onCanister = loc => CANISTER_ID.test(label(loc)) && loc.hostname.includes('.');
  // A domain of the page's own: a name under https that is no canister's
  // host and no replica's. Anything else (a bare localhost, a file) is
  // neither, and has no canister to talk to.
  const atDomain = loc => loc.protocol === 'https:' && loc.hostname.includes('.') && !onCanister(loc) && !/(^|\.)localhost$/.test(loc.hostname);
  // The git canister serving the page.
  const hostOf = loc => atDomain(loc) ? GIT : label(loc);
  // A canister's origin. From a canister's host the rest of the host
  // carries over, so a replica's port does too; from a domain, mainnet's.
  const originOf = (loc, id) => atDomain(loc) ? 'https://' + id + '.raw.icp0.io' : loc.protocol + '//' + loc.host.replace(/^[^.]+/, id);
  // Whether a wallet may be asked to sign here: only where no other
  // site's bytes are served.
  const signs = loc => atDomain(loc);
  async function authorityOf(loc, query) {
    if (atDomain(loc)) return AUTHORITY;
    const host = label(loc);
    if (!onCanister(loc)) throw new Error('this page is served at ' + loc.host + ', neither at a canister\'s own host nor at a domain of its own, so the console has no canister to talk to');
    if (PINNED.has(host)) return AUTHORITY;
    let named;
    try { named = (await query(host, 'get_authority', [], []))[0]; }
    catch (e) {
      // No such method (IC0536, reject code 3): the one-canister build.
      // Any other failure is reported, and asked again at the next mount.
      if (e.errorCode === 'IC0536' || /no query method/i.test(e.message)) return host;
      throw e;
    }
    if (!named) throw new Error('the serving canister names no authority yet');
    return named;
  }
  const canisterFor = (host, authority, method) => GIT_METHODS.has(method) ? host : authority;
  return { hostOf, originOf, authorityOf, canisterFor, signs, HOME, PINNED, GIT_METHODS };
})();
// === end routes ===
</script>
<script>
(() => {
  'use strict';
  const main = document.getElementById('main');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const enc = p => p.split('/').map(encodeURIComponent).join('/');
  const short = o => o.slice(0, 8);
  // One hash builder, one rule: repo, rev and each path component are
  // percent-encoded, so a branch named feature/login is one segment
  // (feature%2Flogin) and route() can split on '/' before decoding.
  const R = r => encodeURIComponent(r);
  const H = (repo, kind, rev, path) => '#/' + enc(repo) + (kind ? '/' + kind + '/' + R(rev) : '') + (path ? '/' + enc(path) : '');
  const when = t => t ? new Date(t * 1000).toISOString().replace('T', ' ').slice(0, 16) + ' UTC' : '';

  // The git canister's origin: this page's on its own host, its raw host
  // from a domain (Routes), whose /api is not the site's.
  const GIT = Routes.originOf(location, Routes.hostOf(location));
  // Its headers reach the page only from its own host: cross-origin the
  // gateway exposes none of ours (access-control-expose-headers is its
  // own list), so from a domain the commit comes from a body.
  const SAME = GIT === location.origin;
  async function api(path) {
    const r = await fetch(GIT + '/api/' + path, { headers: { 'Accept': 'application/json' } });
    const ct = r.headers.get('content-type') || '';
    const commit = r.headers.get('x-ic-git-commit');
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      if (ct.includes('json')) { try { msg = (await r.json()).error || msg; } catch (_) {} }
      throw new Error(msg);
    }
    return { data: ct.includes('json') ? await r.json() : await r.text(), commit };
  }

  // Where this page itself came from: the canister stamps every /site
  // response with the commit it served. Shown, not trusted -- the trusted
  // check is tools/verify.mjs against the registry.
  fetch(location.pathname, { method: 'GET', cache: 'no-store' }).then(r => {
    const c = r.headers.get('x-ic-git-commit'), repo = r.headers.get('x-ic-git-repo');
    if (c) document.getElementById('prov').innerHTML =
      'this page: <a class="oid" href="' + esc(H(repo, 'commit', c)) + '">' + esc(repo) + '@' + esc(short(c)) + '</a>';
  }).catch(() => {});

  const render = html => { main.innerHTML = html; };
  const fail = e => render('<p class="err">' + esc(e.message || e) + '</p>');

  function crumbs(repo, rev, kind, path) {
    const parts = path ? path.split('/') : [];
    let out = '<a href="' + esc(H(repo)) + '">' + esc(repo) + '</a>';
    let acc = '';
    parts.forEach((p, i) => {
      acc += (acc ? '/' : '') + p;
      const last = i === parts.length - 1;
      out += last && kind === 'blob'
        ? '<span>' + esc(p) + '</span>'
        : '<a href="' + esc(H(repo, 'tree', rev, acc)) + '">' + esc(p) + '</a>';
    });
    return '<div class="crumbs">' + out + '</div>';
  }

  function tabs(repo, rev, on) {
    const t = (k, label) => '<a class="' + (on === k ? 'on' : '') + '" href="' + esc(H(repo, k, rev)) + '">' + label + '</a>';
    return '<span class="tabs">' + t('tree', 'files') + t('commits', 'commits') + t('compare', 'compare') + '</span>';
  }

  // A select of the repo's refs with `rev` chosen (a rev that is no ref,
  // a commit id, is listed as itself). Choosing one goes to `go(name)`.
  // A ref is named the short way, main for refs/heads/main, unless a
  // branch and a tag share the short name: then the branch has it, as
  // the canister reads it, and the tag is named in full.
  function refPicker(refs, rev, go, id = 'ref') {
    const names = refs.map(r => r.name).sort();
    const shortOf = n => n.replace(/^refs\/(heads|tags)\//, '');
    const value = n => n.startsWith('refs/tags/') && names.includes('refs/heads/' + shortOf(n)) ? n : shortOf(n);
    const chosen = names.find(n => n === rev) || names.find(n => value(n) === rev);
    const opts = names.map(n => '<option value="' + esc(value(n)) + '"' + (n === chosen ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
    picked.set(id, go);
    return '<select id="' + esc(id) + '">' + opts + (chosen ? '' : '<option selected value="' + esc(rev) + '">' + esc(rev) + '</option>') + '</select>';
  }
  // Where each picker on the page goes; one listener, so a picker works
  // whenever its markup reaches the page, and after it is rendered again.
  const picked = new Map();
  main.addEventListener('change', e => {
    const go = e.target.tagName === 'SELECT' && picked.get(e.target.id);
    if (go) location.hash = go(e.target.value);
  });

  async function showRepos() {
    const { data } = await api('repos');
    if (!data.length) return render('<p class="muted">no repositories yet</p>');
    render('<h2>repositories</h2><table><tr><th>name</th><th>default branch</th><th>site</th><th>clone</th></tr>' +
      data.map(r => '<tr><td><a href="' + esc(H(r.name)) + '">' + esc(r.name) + '</a></td><td class="muted">' + esc(r.head.replace(/^refs\/heads\//, '')) + '</td><td>' +
        (r.site ? '<a href="' + esc(GIT) + '/site/' + esc(enc(r.name)) + '/">/site/' + esc(r.name) + '/</a>' : '<span class="muted">&ndash;</span>') +
        '</td><td><code>git clone ' + esc(GIT) + '/' + esc(enc(r.name)) + '.git</code></td></tr>').join('') + '</table>');
    Console.mount('repos');
  }

  async function showTree(repo, rev, path) {
    let refs, t, commit;
    try {
      [{ data: refs }, { data: t }] = await Promise.all([api(enc(repo) + '/refs'), api(enc(repo) + '/tree/' + encodeURIComponent(rev) + (path ? '/' + enc(path) : ''))]);
      commit = t.commit;
    } catch (e) {
      // Only an unborn HEAD means "no commits yet". A stale rev, a bad path
      // or a failed /refs read is a real error and goes to route()'s fail().
      if (!/HEAD points at an unborn branch/.test(e.message || '')) throw e;
      // A repository with no commits yet: nothing to browse, everything to
      // configure. The ownership panel is what turns an empty repository
      // into one that can be pushed to at all -- the app canister, the
      // deploy config, the push token -- so this page, of all pages, must
      // still show it. Until it did, a repository created from a wallet
      // was a dead end: no token could be minted, so no first commit.
      render(crumbs(repo, rev, 'tree', path) +
        '<p class="muted">This repository has no commits yet; push a first one and its files appear here.</p>');
      Console.mount('repo', repo);
      return;
    }
    const rows = t.entries.map(e => {
      const p = (path ? path + '/' : '') + e.name;
      const href = e.kind === 'tree' ? H(repo, 'tree', rev, p) : e.kind === 'blob' ? H(repo, 'blob', rev, p) : null;
      const name = href ? '<a href="' + esc(href) + '">' + esc(e.name) + (e.kind === 'tree' ? '/' : '') + '</a>' : esc(e.name);
      return '<tr><td>' + name + '</td><td class="muted">' + esc(e.kind === 'blob' ? 'file' : e.kind) + '</td><td class="oid muted">' + esc(short(e.oid)) + '</td></tr>';
    }).join('');
    const up = path ? '<tr><td><a href="' + esc(H(repo, 'tree', rev, path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '')) + '">..</a></td><td></td><td></td></tr>' : '';
    render(crumbs(repo, rev, 'tree', path) +
      '<div class="row">' + refPicker(refs, rev, v => H(repo, 'tree', v, path)) + tabs(repo, rev, 'tree') +
      '<span class="muted">at <a class="oid" href=\"' + esc(H(repo, 'commit', commit)) + '\">' + esc(short(commit)) + '</a></span></div>' +
      '<table>' + up + rows + '</table>');
    Console.mount('repo', repo);
  }

  async function showBlob(repo, rev, path) {
    // A file is read at a commit. On the git canister's own host its
    // header names the one the rev resolved to; from a domain the commit
    // is asked for first and the file read at it, so the two agree.
    const at = SAME || /^[0-9a-f]{40}$/.test(rev) ? rev : (await api(enc(repo) + '/commit/' + encodeURIComponent(rev))).data.oid;
    const read = await api(enc(repo) + '/blob/' + encodeURIComponent(at) + '/' + enc(path));
    const data = read.data, commit = read.commit || at;
    const binary = isBinary(data);
    const body = binary
      ? '<p class="muted">binary file, ' + data.length + ' bytes</p>'
      : '<pre class="src">' + data.split('\n').map(l => '<span class="l">' + esc(l) + '</span>').join('') + '</pre>';
    render(crumbs(repo, rev, 'blob', path) +
      '<div class="row"><span class="muted">' + data.length + ' bytes at <a class="oid" href=\"' + esc(H(repo, 'commit', commit)) + '\">' + esc(short(commit)) + '</a></span>' +
      '<a href="' + esc(GIT) + '/api/' + esc(enc(repo)) + '/blob/' + esc(encodeURIComponent(commit)) + '/' + esc(enc(path)) + '">raw</a>' +
      '<span class="muted"><code>git show ' + esc(short(commit)) + ':' + esc(path) + '</code> reproduces this</span></div>' + body);
  }

  // A commit in a list: its first line, who, when, its tree.
  function commitRow(repo, c) {
    const title = (c.message || '').split('\n')[0];
    return '<div class="commit"><a href=\"' + esc(H(repo, 'commit', c.oid)) + '\"><b>' + esc(title || '(no message)') + '</b></a>' +
      '<div class="muted">' + esc(c.author ? c.author.name : '?') + ' &middot; ' + esc(when(c.author && c.author.time)) + ' &middot; <a class="oid" href=\"' + esc(H(repo, 'tree', c.oid)) + '\">' + esc(short(c.oid)) + '</a></div></div>';
  }

  async function showCommits(repo, rev) {
    const [{ data: refs }, { data: list }] = await Promise.all([api(enc(repo) + '/refs'), api(enc(repo) + '/commits/' + encodeURIComponent(rev) + '?n=50')]);
    const items = list.map(c => commitRow(repo, c)).join('');
    render(crumbs(repo, rev, 'commits', '') + '<div class="row">' + refPicker(refs, rev, v => H(repo, 'commits', v)) + tabs(repo, rev, 'commits') + '</div>' + items);
  }

  // A branch against another (#/<repo>/compare/<head>/<base>, the base
  // the repo's HEAD unless named): where the two part, the commits only
  // the head has, and what they changed between them -- the head's tree
  // against the merge base's, not against the base's tip, which has
  // moved on since. What a pull request would bring.
  async function showCompare(repo, head, base) {
    base = base || 'HEAD';
    // An answer that comes after the reader has gone elsewhere is not
    // shown: this one can be a long walk.
    const here = location.hash;
    const comparing = api(enc(repo) + '/compare/' + encodeURIComponent(head) + '?base=' + encodeURIComponent(base));
    comparing.catch(() => {});
    const { data: refs } = await api(enc(repo) + '/refs');
    const at = (h, b) => H(repo, 'compare', h, b === 'HEAD' ? '' : b);
    // Built when it is rendered: a picker's markup and where it goes
    // reach the page together.
    const top = () => crumbs(repo, head, 'compare', '') +
      '<div class="row"><span>' + refPicker(refs, head, v => at(v, base)) +
      ' <span class="muted">against</span> ' + refPicker(refs, base, v => at(head, v), 'base') + '</span>' +
      tabs(repo, head, 'compare') + '<a href="' + esc(at(base, head)) + '">the other way round</a></div>';
    let d;
    try {
      ({ data: d } = await comparing);
    } catch (e) {
      if (location.hash !== here) return;
      // Two revs too far apart, a rev that is not there, a canister from
      // before /compare: the pickers stay, to choose again.
      return render(top() + '<p class="err">' + esc(e.message || e) + '</p>');
    }
    if (location.hash !== here) return;
    const oid = o => '<a class="oid" href="' + esc(H(repo, 'commit', o)) + '">' + esc(short(o)) + '</a>';
    const n = (k, what) => k + ' ' + what + (k === 1 ? '' : 's');
    const where = !d.merge_base
      ? 'The two share no history: there is no commit both descend from.'
      : d.head === d.base ? 'The two are the same commit, ' + oid(d.head) + '.'
      : n(d.ahead, 'commit') + ' ahead of ' + esc(base) + ', ' + n(d.behind, 'commit') + ' behind it; they part at ' + oid(d.merge_base) + '.';
    // The names are the reader's; the commits they were read as are the
    // canister's, and what the numbers are of.
    const read = d.head === d.base ? '' : ' <span class="muted">' + esc(head) + ' is ' + oid(d.head) + ', ' + esc(base) + ' is ' + oid(d.base) + '.</span>';
    const none = d.ahead ? '' : d.head === d.base ? '' : d.merge_base
      ? '<p class="muted">Nothing to bring: ' + esc(base) + ' already has every commit of ' + esc(head) + '.</p>' : '';
    render(top() + '<p>' + where + read + '</p>' + none +
      (d.ahead ? '<h3>' + n(d.ahead, 'commit') + '</h3>' + d.commits.map(c => commitRow(repo, c)).join('') +
        (d.truncated ? '<p class="muted">The newest ' + d.commits.length + ' are listed.</p>' : '') : '') +
      (d.merge_base && d.ahead ? '<div id="diff"><p class="muted">reading what changed&hellip;</p></div>'
        : !d.merge_base ? '<p class="muted">With nothing in common there is no change to show between them; <a href="' + esc(H(repo, 'commit', d.head, d.base)) + '">the two trees can still be compared</a>.</p>' : ''));
    const box = document.getElementById('diff');
    if (box) await showDiff(repo, d.head, d.merge_base, box);
  }

  // A commit, and under it what it changed: against its first parent, or
  // against `base` when the address names one (#/<repo>/commit/<rev>/<base>),
  // which is how any two revs are compared.
  async function showCommit(repo, oid, base) {
    const { data: c } = await api(enc(repo) + '/commit/' + encodeURIComponent(oid));
    const who = (label, id) => id ? '<tr><th>' + label + '</th><td>' + esc(id.name) + ' &lt;' + esc(id.email) + '&gt; <span class="muted">' + esc(when(id.time)) + ' ' + esc(id.tz) + '</span></td></tr>' : '';
    render(crumbs(repo, c.oid, 'commits', '') +
      '<table>' +
      '<tr><th>commit</th><td class="oid">' + esc(c.oid) + ' &middot; <a href=\"' + esc(H(repo, 'tree', c.oid)) + '\">browse files</a></td></tr>' +
      '<tr><th>tree</th><td class="oid">' + esc(c.tree) + '</td></tr>' +
      (c.parents.length ? '<tr><th>parents</th><td class="oid">' + c.parents.map(p => '<a href=\"' + esc(H(repo, 'commit', p)) + '\">' + esc(p) + '</a>').join('<br>') + '</td></tr>' : '') +
      who('author', c.author) + who('committer', c.committer) +
      '</table><pre>' + esc(c.message) + '</pre><div id="diff"><p class="muted">reading what changed&hellip;</p></div>');
    Console.mount('commit', repo, c.oid);
    await showDiff(repo, c.oid, base, document.getElementById('diff'), c.parents);
  }

  // How many files open with their lines when the commit is shown; the
  // rest are read when opened.
  const OPEN_FILES = 10;
  // A file past this is not compared here: its two blobs are still a
  // click away.
  const MAX_DIFF_CHARS = 1000000;
  const isBinary = text => /[\x00-\x08\x0E-\x1F]/.test(text.slice(0, 8000));

  // What `oid` changed against `base`, or against its first parent where
  // none is named: `parents` are then the commit's, for the links to the
  // others.
  async function showDiff(repo, oid, base, box, parents = []) {
    let d;
    try {
      ({ data: d } = await api(enc(repo) + '/diff/' + encodeURIComponent(oid) + (base ? '?base=' + encodeURIComponent(base) : '')));
    } catch (e) {
      // A canister from before /diff answers 404 "not found": the commit
      // is shown as it always was.
      if (box.isConnected) box.innerHTML = '<p class="muted">what changed could not be read: ' + esc(e.message || e) + '</p>';
      return;
    }
    if (!box.isConnected) return;
    const n = d.files.length;
    const against = !d.base ? '&middot; a first commit: every file is new'
      : 'against <a class="oid" href="' + esc(H(repo, 'commit', d.base)) + '">' + esc(short(d.base)) + '</a>' +
        (base ? '' : parents.length > 1 ? ', its first parent' + parents.slice(1).map((p, i) =>
          ' &middot; <a href="' + esc(H(repo, 'commit', oid, p)) + '">against parent ' + (i + 2) + '</a>').join('') : '');
    box.innerHTML = '<h3>' + n + (d.truncated ? ' or more' : '') + ' file' + (n === 1 && !d.truncated ? '' : 's') + ' changed <span class="muted" style="font-weight:400">' + against + '</span></h3>' +
      (d.truncated ? '<p class="muted">The list stops here: there are more changes than one answer holds, and renames are not paired in a list cut short.</p>' : '') +
      d.files.map((f, i) => {
        const at = f.new ? d.commit : d.base;
        const name = (f.old_path ? esc(f.old_path) + ' &rarr; ' : '') + esc(f.path);
        const link = (f.new || f.old).kind === 'commit' ? name : '<a href="' + esc(H(repo, 'blob', at, f.path)) + '">' + name + '</a>';
        const st = f.status === 'added' ? 'plus' : f.status === 'deleted' ? 'minus' : 'muted';
        return '<details class="file" data-i="' + i + '"><summary><span class="st ' + st + '">' + esc(f.status) + '</span><span class="path">' + link + '</span><span class="count muted"></span></summary><div class="body"></div></details>';
      }).join('');
    box.querySelectorAll('details.file').forEach(el => {
      const f = d.files[+el.dataset.i];
      // Read once; a read that failed is tried again when the file is
      // opened again.
      let read = false;
      const open = () => {
        if (read || !el.open) return;
        read = true;
        fileDiff(repo, d, f).then(r => {
          el.querySelector('.body').innerHTML = r.html;
          if (r.count) el.querySelector('.count').innerHTML = r.count;
        }).catch(e => {
          read = false;
          el.querySelector('.body').innerHTML = '<p class="err">' + esc(e.message || e) + ' <span class="muted">(close and open to try again)</span></p>';
        });
      };
      el.addEventListener('toggle', open);
      if (+el.dataset.i < OPEN_FILES) { el.open = true; open(); }
    });
  }

  // One file's change: { html, count }. The two blobs are read at the
  // commits the canister compared, by the paths it named.
  async function fileDiff(repo, d, f) {
    const note = text => ({ html: '<p class="muted">' + text + '</p>' });
    const mode = f.old && f.new && f.old.mode !== f.new.mode ? 'mode ' + esc(f.old.mode) + ' &rarr; ' + esc(f.new.mode) : '';
    // A submodule on either side: there is a commit of another repo to
    // name and no blob to compare.
    const sub = x => x && x.kind === 'commit';
    if (sub(f.old) || sub(f.new)) {
      const was = x => !x ? 'nothing' : sub(x) ? 'submodule at <span class="oid">' + esc(short(x.oid)) + '</span>' : 'a file';
      return note(was(f.old) + ' &rarr; ' + was(f.new));
    }
    if (f.old && f.new && f.old.oid === f.new.oid) {
      return note((f.status === 'renamed' ? 'renamed, the content unchanged' : 'the content unchanged') + (mode ? '; ' + mode : ''));
    }
    // A blob past what the canister gives in one answer is too large
    // here as well: null.
    const blob = (commit, path) => api(enc(repo) + '/blob/' + encodeURIComponent(commit) + '/' + enc(path)).then(r => r.data,
      e => { if (/exceeds the single-response limit/.test(e.message || '')) return null; throw e; });
    const [a, b] = await Promise.all([f.old ? blob(d.base, f.old_path || f.path) : '', f.new ? blob(d.commit, f.path) : '']);
    const large = x => x === null || x.length > MAX_DIFF_CHARS;
    if (large(a) || large(b)) return note('too large to compare here' + (mode ? '; ' + mode : ''));
    if (isBinary(a) || isBinary(b)) return note('binary file' + (mode ? '; ' + mode : ''));
    const hs = Diff.hunks(a, b);
    if (!hs) return note('too many changed lines to show here');
    // Nothing to mark: an empty file come or gone, or two blobs whose
    // bytes differ and whose text, as the page reads it, does not.
    if (!hs.length) return note((a === '' && b === '' ? 'an empty file' : 'no difference in the text; the bytes differ') + (mode ? '; ' + mode : ''));
    let plus = 0, minus = 0, rows = '';
    for (const h of hs) {
      rows += '<tr class="hunk"><td class="n"></td><td class="n"></td><td>' + esc(Diff.header(h)) + '</td></tr>';
      for (const [op, text, oldNo, newNo, bare] of h.lines) {
        if (op === '+') plus++; else if (op === '-') minus++;
        rows += '<tr class="' + (op === '+' ? 'add' : op === '-' ? 'del' : '') + '"><td class="n">' + (oldNo || '') + '</td><td class="n">' + (newNo || '') + '</td><td>' + op + esc(text) + '</td></tr>' +
          (bare ? '<tr class="hunk"><td class="n"></td><td class="n"></td><td>\\ No newline at end of file</td></tr>' : '');
      }
    }
    return {
      html: (mode ? '<p class="muted">' + mode + '</p>' : '') + '<table class="diff">' + rows + '</table>',
      count: '<span class="plus">+' + plus + '</span> <span class="minus">&minus;' + minus + '</span>',
    };
  }

  async function route() {
    const raw = location.hash.replace(/^#\/?/, '');
    const dec = x => { try { return decodeURIComponent(x); } catch (_) { return x; } };
    const seg = raw ? raw.split('/').map(dec) : [];
    try {
      if (!seg.length) return await showRepos();
      const repo = seg[0];
      const kind = seg[1] || 'tree';
      const rev = seg[2] || 'HEAD';
      const path = seg.slice(3).join('/');
      if (kind === 'tree') return await showTree(repo, rev, path);
      if (kind === 'blob') return await showBlob(repo, rev, path);
      if (kind === 'commits') return await showCommits(repo, rev);
      if (kind === 'commit') return await showCommit(repo, rev, path);
      if (kind === 'compare') return await showCompare(repo, rev, path);
      throw new Error('unknown view: ' + kind);
    } catch (e) { fail(e); }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
<script>
// === console ===
// Signed-in mode (docs/TENANCY.md, "Console"), at a domain of the page's own
// only (routes, above). Reads come from the canisters' /api like the rest of
// the page, except the wallet's ledger balances, which are anonymous
// queries to the IC HTTP API; every write is a canister call signed by the user's
// wallet through the IC signer standards (ICRC-25/27/29/49), which OISY
// implements. The page never holds a key: it encodes arguments, the wallet
// signs and submits, and the page decodes the reply from the certificate the
// wallet hands back.
const Console = (() => {
  'use strict';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // The canister serving this page, and the authority: known once ready()
  // resolves, which mount() waits for before any panel. A lookup that
  // failed is made again at the next mount, not held against the page.
  const HOST = Routes.hostOf(location);
  const SIGNS = Routes.signs(location);
  let AUTHORITY = null, lookup = null;
  const ready = () => lookup ||= Routes.authorityOf(location, IC.query).then(a => { AUTHORITY = a; }, e => { lookup = null; throw e; });
  const at = method => Routes.canisterFor(HOST, AUTHORITY, method);
  const CYCLES_LEDGER = 'um5iw-rqaaa-aaaaq-qaaba-cai';
  const ICP_LEDGER = 'ryjl3-tyaaa-aaaaa-aaaba-cai';
  const CMC = 'rkp4c-7iaaa-aaaaa-aaaca-cai';
  const ICP_FEE = 10_000n; // e8s
  const ACCOUNT = { record: { owner: 'principal', subaccount: { opt: 'blob' } } };
  // ICRC-2 icrc2_approve's argument, for both the cycles and the ICP ledger.
  const APPROVE = { record: { from_subaccount: { opt: 'blob' }, spender: ACCOUNT, amount: 'nat', expected_allowance: { opt: 'nat' }, expires_at: { opt: 'nat64' }, fee: { opt: 'nat' }, memo: { opt: 'blob' }, created_at_time: { opt: 'nat64' } } };
  const SIGNER = { url: 'https://oisy.com/sign', origin: 'https://oisy.com' };
  const T = 1_000_000_000_000n;
  // Cycles for humans: T above 0.01 T, otherwise B or M.
  const fmtT = n => { n = BigInt(n); if (n >= 10_000_000_000n) { const whole = n / T, frac = (n % T) / 1_000_000_000n; return whole + '.' + String(frac).padStart(3, '0') + ' T'; } if (n >= 1_000_000_000n) return (Number(n) / 1e9).toFixed(1) + ' B cycles'; return (Number(n) / 1e6).toFixed(0) + ' M cycles'; };
  const short = p => p.length > 20 ? p.slice(0, 5) + '...' + p.slice(-3) : p;
  const fmtCycles = n => { const s = fmtT(n); return s.endsWith(' T') ? s + ' cycles' : s; };
  // ICP for humans: e8s to a decimal with the trailing zeros trimmed (at least two places).
  const fmtIcp = n => { n = BigInt(n); const s = (n % 100_000_000n).toString().padStart(8, '0').replace(/0+$/, '').padEnd(2, '0'); return (n / 100_000_000n) + '.' + s + ' ICP'; };
  // Any ledger's base units as a decimal of its token, and back: a gas
  // ledger names its own decimals and symbol. Never through floating point.
  const fmtUnits = (n, d, sym) => { n = BigInt(n); const one = 10n ** BigInt(d), f = d ? (n % one).toString().padStart(d, '0').replace(/0+$/, '') : ''; return (n / one) + (f ? '.' + f : '') + ' ' + sym; };
  const parseUnits = (s, d, sym) => { const m = /^\s*(\d*)(?:\.(\d*))?\s*$/.exec(s); if (!m || (!m[1] && !m[2]) || (m[2] || '').length > d) throw new Error('enter an amount in ' + sym + ', at most ' + d + ' decimal places'); return BigInt(m[1] || '0') * 10n ** BigInt(d) + BigInt((m[2] || '').padEnd(d, '0') || '0'); };
  const nsDate = ns => new Date(Number(BigInt(ns) / 1_000_000n)).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  const RESULT_TYPES = {}; // method -> nothing needed: replies are self-describing

  // --- signer (ICRC-25 over postMessage) ---
  // Mirrors the reference relying party (dfinity/oisy-wallet-signer): the
  // readiness ping is posted with target origin "*" because the popup may be
  // on a login screen or mid-redirect, replies are accepted only from the
  // popup window itself and from the signer's origin, and the user gets two
  // minutes to log in before the connection is abandoned.
  const CONNECT_TIMEOUT_MS = 180000, INTERACT_TIMEOUT_MS = 120000, PING_MS = 500;
  const signer = {
    win: null, ready: false, nextId: 1, pending: new Map(),
    listen() {
      if (this.listening) return; this.listening = true;
      window.addEventListener('message', e => {

    async connect(progress) {

      while (!this.ready) {
        if (this.win.closed) throw new Error('wallet window was closed');
        if (Date.now() > until) throw new Error('wallet did not answer within ' + (CONNECT_TIMEOUT_MS / 1000) + 's');
        if (progress && n++ % 10 === 0) progress('waiting for OISY' + (n > 10 ? ' (log in there if asked)' : '') + '...');
        try { if (await this.request('icrc29_status', undefined, PING_MS, '*') === 'ready') this.ready = true; } catch (_) {}
      }

    },
    async accounts() {
      await this.request('icrc25_request_permissions', { scopes: [{ method: 'icrc27_accounts' }, { method: 'icrc49_call_canister' }] }, INTERACT_TIMEOUT_MS);
      const r = await this.request('icrc27_accounts', undefined, INTERACT_TIMEOUT_MS);
      return (r.accounts || []).map(a => a.owner);
    },
    async call(canisterId, sender, method, types, values) {
      const arg = IC.b64enc(IC.encode(types, values));
      const r = await this.request('icrc49_call_canister', { canisterId, sender, method, arg }, INTERACT_TIMEOUT_MS);
      return (await IC.callResult(r))[0];
    },
    // Close the popup when an interaction is over; the next write reopens
    // it. Left open, OISY sits on "waiting for the dapp".
    disconnect() {
      try { if (this.win && !this.win.closed) this.win.close(); } catch (_) {}
      this.win = null; this.ready = false;
    },
  };

  // --- session ---
  let me = null;
  try { if (SIGNS) me = localStorage.getItem('ic-git.principal'); } catch (_) {}
  // Where the page may not sign: on mainnet's hosts, where it does; on
  // another canister's host, why not.
  const elsewhere = () => Routes.PINNED.has(HOST)
    ? 'to sign in, open the console at <a href="' + esc(Routes.HOME) + '/">' + esc(Routes.HOME.replace(/^https:\/\//, '')) + '</a>'
    : 'this copy signs nothing: every site on this canister\'s host shares its origin';
  const walletEl = () => document.getElementById('wallet');
  function paintWallet() {
    const el = walletEl(); if (!el) return;
    el.innerHTML = !SIGNS ? '<span class="muted">' + elsewhere() + '</span>'
      : me
      ? '<span class="muted">signed in as</span> <span class="oid" title="' + esc(me) + '">' + esc(short(me)) + '</span> <button id="signout">sign out</button>'
      : '<button id="signin">connect wallet</button>';

    if (si) si.onclick = signIn;
    if (so) so.onclick = () => { me = null; try { localStorage.removeItem('ic-git.principal'); } catch (_) {} signer.disconnect(); paintWallet(); location.reload(); };
  }
  async function signIn() {
    if (!SIGNS) return;
    const el = walletEl();
    const say = msg => { if (el) el.innerHTML = '<span class="muted">' + esc(msg) + '</span>'; };
    try {
      say('opening OISY...');
      await signer.connect(say);
      say('approve the connection in OISY...');
      const accounts = await signer.accounts();
      if (!accounts.length) throw new Error('wallet returned no accounts');
      me = accounts[0]; try { localStorage.setItem('ic-git.principal', me); } catch (_) {}
      signer.disconnect();
      paintWallet(); location.reload();
    } catch (e) {
      signer.disconnect();
      paintWallet();
      if (el) el.insertAdjacentHTML('afterbegin', '<span class="bad">sign in failed: ' + esc(e.message) + '</span> ');
    }
  }
  // One wallet session per user action. The popup is opened once, inside
  // the click that asked for it, and closed when the outermost action is
  // over. An action that signs more than once (deposit is two calls,
  // reinstall is three) must not reopen the popup between them: a
  // window.open that runs after an await has left the user's click behind,
  // and the browser's popup blocker refuses it -- which is how the first
  // half of a deposit could succeed and the second half never happen.
  // An action counts itself in before it waits for the connection, not
  // after: otherwise an action that finishes while a second one is still
  // waiting for OISY to answer would see no other session and close the
  // popup the second one is waiting on.
  let sessions = 0;
  async function session(fn) {
    if (!SIGNS) throw new Error('this copy of the console signs nothing here');
    if (!me) throw new Error('connect a wallet first');
    sessions++;
    try { await signer.connect(null); return await fn(sign); }
    finally { if (--sessions === 0) signer.disconnect(); }
  }
  // Sign one call in the open session, decode, unwrap Result. The call goes
  // to the canister that holds the method unless one is named (a ledger).
  async function sign(method, types, values, canister) {
    const r = await signer.call(canister || at(method), me, method, types, values);
    if (r && typeof r === 'object' && 'Err' in r) throw new Error(typeof r.Err === 'string' ? r.Err : JSON.stringify(r.Err, (k, v) => typeof v === 'bigint' ? v.toString() : v));
    return r && typeof r === 'object' && 'Ok' in r ? r.Ok : r;
  }
  // A single-call action.
  const write = (method, types, values, canister) => session(s => s(method, types, values, canister));

  // --- panels ---
  // The tenancy reads (api_authority.rs: pricing, account, info, votes,
  // proposals, deploys) are the authority's; the git reads above (api())
  // are the serving canister's. Both are cross-origin from a domain, and
  // the tenancy reads from the git canister's host too: the gateway answers
  // a canister's responses with access-control-allow-origin: *, and a
  // plain GET needs no preflight.
  const get = async path => {
    const r = await fetch(Routes.originOf(location, AUTHORITY) + '/api/' + path);
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      if ((r.headers.get('content-type') || '').includes('json')) { try { msg = (await r.json()).error || msg; } catch (_) {} }

      const tokens = () => IC.query(at('list_push_tokens'), 'list_push_tokens', ['text'], [repo]).then(async r => {
        const ts = r[0];
        const el = document.getElementById('tok-list');
        if (!el) return ts;
        const fps = await Promise.all(ts.map(t => t.key ? fingerprint(t.key).catch(() => t.key) : null));
        el.innerHTML = !ts.length ? '<p class="muted">no live push tokens.</p>'
          : '<table><tr><th>push token</th><th>minted by</th><th>bound key</th><th>expires</th><th></th></tr>' + ts.map((t, i) => '<tr><td class="oid">' + esc(t.id) + '</td><td class="oid">' +
            (t.minted_by ? esc(short(t.minted_by)) : '<span class="muted">before expiry existed</span>') + '</td><td class="oid">' +
            (fps[i] ? esc(fps[i]) : '<span class="muted">none</span>') + '</td><td>' + esc(nsDate(t.expires_ns)) +
            '</td><td><button class="tok-rm" type="button" data-id="' + esc(t.id) + '">revoke</button></td></tr>').join('') + '</table>';
        el.querySelectorAll('button.tok-rm').forEach(b => { b.onclick = async () => {
          b.disabled = true;
          status('tok-list-st', 'waiting for wallet...', true);
          try { await write('revoke_push_token_id', ['text'], [b.dataset.id]); status('tok-list-st', 'revoked ' + b.dataset.id, true); tokens(); }
          catch (e) { b.disabled = false; status('tok-list-st', e.message, false); }
        }; });
        return ts;
      }, e => { const el = document.getElementById('tok-list'); if (el) el.innerHTML = '<p class="muted">push tokens: could not be read (' + esc(e.message) + ')</p>'; });
      if (isWriter) tokens();
      onsubmit('f-accept', async () => { await write('accept_transfer', ['text'], [repo]); setTimeout(() => location.reload(), 800); return 'accepted: the repository is yours'; });
      onsubmit('f-cancel', async () => { await write('cancel_transfer', ['text'], [repo]); setTimeout(() => location.reload(), 800); return 'the offer is withdrawn'; });
      onsubmit('f-token', async v => {
        const d = v.days.trim();
        const days = d ? Number(d) : null;
        if (days !== null && !(Number.isInteger(days) && days >= 1 && days <= 365)) throw new Error('lifetime is a whole number of days, 1 to 365');
        const key = v.key.trim() || null;
        if (key && !key.startsWith('ssh-ed25519 ')) throw new Error('only ssh-ed25519 keys can be bound (the contents of ~/.ssh/id_ed25519.pub)');
        const token = await write('create_push_token', ['text', { opt: 'nat32' }, { opt: 'text' }], [repo, days, key]);
        // The expiry comes from the canister, not from a default copied
        // here: a token's id is the first 16 hex characters of the sha256 of
        // its text, so the new token can be found in the refreshed list.
        // The token is shown once, so a failure here must not hide it.
        let mine;
        try {
          const id = IC.hex(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(token))).slice(0, 8));
          mine = ((await tokens()) || []).find(t => t.id === id);
        } catch (e) { console.warn('push token list: ' + e.message); }
        return 'token (shown once' + (mine ? ', valid until ' + nsDate(mine.expires_ns) : '') + '): ' + token + '  -> git push https://ic:<token>@' + Routes.originOf(location, HOST).replace(/^https?:\/\//, '') + '/' + repo + '.git main' +
          (key ? '  -- bound to that key, so sign pushes with it: git config gpg.format ssh; git config user.signingkey <path to that .pub>; git config push.gpgSign if-asked' : '');
      });
      onsubmit('f-transfer', async v => { await write('transfer_repo', ['text', 'principal'], [repo, v.principal.trim()]); setTimeout(() => location.reload(), 800); return 'offered: it is theirs once they accept'; });
      onsubmit('f-signed', async () => {
        await write('set_require_signed_push', ['text', 'bool'], [repo, !info.require_signed_push]);
        setTimeout(() => location.reload(), 800);
        return info.require_signed_push ? 'signed pushes no longer required' : 'pushes must now be signed: tokens without a bound key are refused';
      });
      onsubmit('f-member', async v => { await write('add_member', ['text', 'principal', 'text'], [repo, v.principal.trim(), v.role.trim()]); setTimeout(() => location.reload(), 800); return 'added'; });
      onsubmit('f-votes', async v => { await write('set_required_votes', ['text', 'nat32'], [repo, Number(v.k)]); setTimeout(() => location.reload(), 800); return 'saved'; });
      governanceWire(repo, info);
      onsubmit('f-app', async v => { const id = await write('create_app_canister', ['text', 'nat64'], [repo, cycles(v.amount)]); setTimeout(() => location.reload(), 800); return 'created app canister ' + id; });
      onsubmit('f-topup', async v => { await write('top_up_app_canister', ['text', 'nat64'], [repo, cycles(v.amount)]); return 'topped up'; });
      const wasmLeg = c => c.source_path + ' into ' + (c.target === info.app_canister ? 'the app canister' : short(c.target)) + ' (' + Object.keys(c.mode)[0] + ')';
      const evmLeg = c => 'a contract from ' + c.source_path + ' on the EVM chain (gas limit ' + c.gas_limit + ')';
      land('cfg-deploy', Promise.all([deployCfg, evmCfg]), ([w, e]) => w === undefined || e === undefined ? '?' : [w && wasmLeg(w), e && evmLeg(e)].filter(Boolean).join(' and ') || 'nothing (not configured)');
      land('cfg-site', siteCfg, c => c === null ? 'not served' : 'served from ' + (c.root ? c.root + '/' : 'the repo root') + ' at /site/' + repo + '/' + (c.domains && c.domains.length ? ' and at ' + c.domains.map(d => 'https://' + d + '/').join(' ') : '') + (info.required_votes ? ', from the newest approved commit' : ''));
      // "app" names the repo's own app canister; the canister resolves it.
      onsubmit('f-deploy', async v => { await write('set_wasm_deploy', ['text', 'text', 'text'], [repo, 'app', v.path.trim()]); setTimeout(() => location.reload(), 800); return 'each push to the deploy branch now installs ' + v.path.trim(); });
      onsubmit('f-site', async v => { const root = v.root.trim().replace(/^\/+|\/+$/g, ''); await write('set_site', ['text', 'text'], [repo, root]); setTimeout(() => location.reload(), 800); return 'serving ' + (root || 'the repo root') + ' at /site/' + repo + '/'; });
      // The whole list each time; the canister checks the names. A domain
      // reaches the canister only once its DNS and the boundary nodes know it.
      onsubmit('f-domains', async v => { const domains = v.domains.trim().split(/\s+/).filter(Boolean); await write('set_site_domains', ['text', { vec: 'text' }], [repo, domains]); setTimeout(() => location.reload(), 800); return domains.length ? 'serving at ' + domains.map(d => 'https://' + d + '/').join(' ') + ' once its DNS names this canister and the boundary nodes have registered it' : 'serving at no domain of its own'; });
      // What deploy now and reinstall install: with votes required, the
      // approved commit the site serves, not the tip.
      const release = info.required_votes ? 'the newest approved commit' : 'the deploy-branch tip';
      // A failed read (undefined) still shows the box, with a warning: the
      // canister refuses an unserved repo before charging anything.
      // What one EVM action costs in cycles: the fee alone, for the
      // signature and the outcalls. Its gas is paid from the gas balance.
      const evmCost = pr => BigInt(pr.evm_action);
      const gasNote = pr => 'the gas is paid from the gas balance of whoever pays this repo, in the chain\'s asset: the most it may cost is held when it is sent, and the receipt charges what it used, with a ' + (pr.gas_markup_bps ?? 100) / 100 + '% markup.';
      Promise.all([siteCfg, pricing]).then(([c, pr]) => {
        const box = document.getElementById('box-pubsite');
        if (!box || c === null) return;
        box.hidden = false;
        document.getElementById('pubsite-cost').textContent = c === undefined || pr === undefined
          ? 'could not read the site config or the fee table; reload before publishing.'
          : 'writes set("' + repo + '#site", ' + release + ', sha256 of the served entrypoint) from the canister\'s EOA and charges ' +
            fmtT(evmCost(pr)) + ' from the repo balance; ' + gasNote(pr);
      });
      // The call returns once the transaction is broadcast, not mined.
      onsubmit('f-pubsite', async () => { const t = await write('evm_registry_publish_site', ['text'], [repo]); return 'broadcast ' + repo + '#site: tx ' + t.tx_hash + ' (nonce ' + t.nonce + '); not yet confirmed on chain'; });
      const outcome = d => (d.ok ? 'deployed ' : 'deploy failed: ') + d.message + ' (commit ' + short(d.commit) + (d.wasm_sha256 ? ', wasm sha256 ' + d.wasm_sha256.slice(0, 12) + ')' : ')');
      onsubmit('f-deploynow', async () => outcome(await write('deploy_now', ['text'], [repo])));
      const box = document.getElementById('box-reinstall'), inp = document.getElementById('in-reinstall'), go = document.getElementById('go-reinstall');
      const btn = document.getElementById('btn-reinstall'), cancel = document.getElementById('cancel-reinstall');
      // What deploy now and reinstall will do and charge, from the configs.
      // A deploy runs every configured leg: the EVM leg broadcasts a new
      // CREATE transaction each time, which costs ic-git's fee here and gas
      // on the other chain, and is not undone by anything on this side.
      // The cost line is on every repo with an app canister; the reinstall
      // button only where the repo is not governed, so it alone is optional.
      const cost = document.getElementById('deploy-cost');
      if (cost) Promise.all([deployCfg, evmCfg, pricing]).then(([w, e, pr]) => {
        const what = document.getElementById('reinstall-what');
        if (w === undefined || e === undefined || pr === undefined) { cost.textContent = 'could not read the deploy config or the fee table; reload before deploying.'; return; }
        const fee = BigInt(w ? pr.ic_deploy : 0) + (e ? evmCost(pr) : 0n);
        const evmNote = e ? 'a new CREATE transaction for ' + e.source_path + ' on the EVM chain (gas limit ' + e.gas_limit + '): a fresh contract at a new address; ' + gasNote(pr) : '';
        // A governed repo's install into its app canister also publishes the
        // <repo>#app record, one more evm_action, where a registry is set.
        // The EVM deploy's own registry record is a second transaction and
        // a second evm_action, likewise where a registry is set.
        const evmRecordNote = e ? ' The deploy is then recorded in the registry, ' + fmtT(evmCost(pr)) + ' more where one is configured.' : '';
        const appNote = w && info.governed && w.target === info.app_canister ? ' Governed: the install is recorded on chain as ' + repo + '#app, ' + fmtT(evmCost(pr)) + ' more where a registry is configured.' : '';
        cost.textContent = !w && !e ? 'nothing is configured to deploy.'
          : 'deploy now runs every configured leg against ' + release + ' and charges ' + fmtT(fee) + ' from the repo balance.' + (e ? ' It also broadcasts ' + evmNote + evmRecordNote : '') + appNote;
        if (!btn) return;
        if (!w) { btn.title = 'nothing is configured to deploy into a canister'; return; }
        const target = w.target === info.app_canister
          ? 'app canister ' + w.target
          : 'canister ' + w.target + ', the configured deploy target, which is NOT this repo\'s app canister (' + info.app_canister + ')';
        what.innerHTML = '<b>Reinstall wipes every byte of state in ' + esc(target) + '</b> and installs ' + esc(w.source_path) + ' from ' + release + '. Ballots, balances, anything the app stored: gone. There is no undo.' +
          (e ? '<br><b>It also redeploys the EVM contract</b>, broadcasting ' + esc(evmNote) : '') + '<br>ic-git charges ' + esc(fmtT(fee)) + ' for the deploy.' + esc(evmRecordNote);
        btn.disabled = false;
      });
      if (btn) btn.onclick = () => { box.hidden = false; inp.value = ''; go.disabled = true; inp.focus(); };
      if (cancel) cancel.onclick = () => { box.hidden = true; };
      if (inp) inp.oninput = () => { go.disabled = inp.value.trim() !== repo; };
      if (go) go.onclick = async () => {
        if (inp.value.trim() !== repo) return;
        go.disabled = true; btn.disabled = true;
        // The mode is a setting, not an action: it stays until changed. So
        // switch, deploy, and switch back, and say so loudly if the switch
        // back did not happen -- every later push would wipe state again.
        let restored = false;
        try {
          // All three calls in one wallet session: the popup opened by this
          // click stays open, so no call is refused by the popup blocker.
          await session(async s => {
            try {
              status('reinstall-st', 'switching the install mode to reinstall...', true);
              await s('set_deploy_mode', ['text', 'text'], [repo, 'reinstall']);
              status('reinstall-st', 'reinstalling from ' + release + '...', true);
              const d = await s('deploy_now', ['text'], [repo]);
              status('reinstall-st', 'switching the install mode back to upgrade...', true);
              await s('set_deploy_mode', ['text', 'text'], [repo, 'upgrade']);

            } catch (e) {

            }

        } catch (e) {
