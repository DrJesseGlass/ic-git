[package]
name = "combined_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# From crates.io since 0.4.0 (was a git tag). 0.x: minor bumps are breaking.
ic-dev-kit-rs = { version = "0.4", features = ["storage"] }

# Keep these pinned to the versions ic-dev-kit-rs uses.
ic-cdk = "0.20"
ic-cdk-timers = "1"
candid = "0.10"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Track B, rung R4: concurrent fan-out of compile jobs across worker canisters.
futures = "0.3"
hex = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# The workspace crates of docs/CANISTER_SPLIT.md, phase 2 step 4: linked
# into this one canister until phase 3 cuts the boundary.
ic-git-authority = { path = "../../crates/authority" }
ic-git-common = { path = "../../crates/common" }
ic-git-compiler = { path = "../../crates/compiler" }
ic-git-git = { path = "../../crates/git" }
ic-git-types = { path = "../../crates/types" }

[dev-dependencies]
# The workspace crates' test hooks (a settable clock and controllers, timer
# stubs, the git side standing in for the authority), for tests only.
ic-git-authority = { path = "../../crates/authority", features = ["testing"] }
ic-git-common = { path = "../../crates/common", features = ["testing"] }
ic-git-git = { path = "../../crates/git", features = ["testing"] }
