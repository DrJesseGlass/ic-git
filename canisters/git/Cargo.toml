[package]
name = "git_canister"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "ic-git's git canister (docs/CANISTER_SPLIT.md, phase 3 step 12c): the build for the new canister. Reaches the authority by messages."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# From crates.io since 0.4.0 (was a git tag). 0.x: minor bumps are breaking.
ic-dev-kit-rs = { version = "0.4", features = ["storage"] }

# Keep these pinned to the versions ic-dev-kit-rs uses.
ic-cdk = "0.20"
ic-cdk-timers = "1"
candid = "0.10"

serde = { version = "1", features = ["derive"] }
hex = { version = "0.4", features = ["serde"] }
base64 = "0.23"

# The workspace crates of docs/CANISTER_SPLIT.md: the git side, and what
# both sides share. Never the authority.
ic-git-common = { path = "../../crates/common" }
ic-git-git = { path = "../../crates/git" }
ic-git-types = { path = "../../crates/types" }
