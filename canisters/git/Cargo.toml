[package]
name = "git_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
ic-dev-kit-rs = { git = "https://github.com/DrJesseGlass/ic-dev-kit-rs", tag = "v0.3.0", features = ["storage"] }
# K-of-N approvals (docs/TENANCY.md, "Votes"): the policy, ballot and tally
# rules shared with ic-vote. Pinned by revision; Cargo.lock pins it too.
ic-multisig = { git = "https://github.com/DrJesseGlass/ic-multisig", rev = "1ce84cd3a010a9c3b32ec0a147fe88d1ec2a929f", features = ["candid"] }

# Keep these pinned to the versions ic-dev-kit-rs uses.
ic-cdk = "0.20"
ic-cdk-timers = "1"
candid = "0.10"
ic-stable-structures = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Track B, rung R4: concurrent fan-out of compile jobs across worker canisters.
futures = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha1 = "0.10"
sha2 = "0.10"
hex = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# Track B, rung R0 (see ROADMAP.md): on-chain WAT -> wasm assembler plus a
# validation pass. Both pure Rust, no filesystem/threads, target
# wasm32-unknown-unknown. wasmparser is already in-tree via wat/wast.
wat = "1"
wasmparser = "0.253"
# Track B, rung R1: emit wasm directly from our own compiler (no LLVM).
wasm-encoder = "0.253"
# Track B, rung R6: interpret a wasm32-wasip1 module (eventually rustc.wasm)
# held as data in stable memory. Pure Rust, builds to wasm32-unknown-unknown.
wasmi = "1"

# Track A (see ROADMAP.md): sign EVM transactions with threshold ECDSA.
# sha3 for keccak256; k256 (pure Rust, no getrandom without the rand feature)
# to decompress the SEC1 pubkey into an EOA and to find the recovery id by
# trial recovery. Both build cleanly to wasm32-unknown-unknown.
sha3 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }

[dev-dependencies]
