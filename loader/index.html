<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ic-git loader</title>
<!--
  ic-git loader: check a site against its ProvenanceRegistry record, then
  run exactly the bytes that were checked.

  Keep this file and open it from disk (or any origin you trust). It is the
  verifier, so it must not come from the canister it verifies: a page that
  canister serves could simply claim success. One file, no dependencies,
  small enough to read before you trust it.

  For repo R on canister C it:
    1. reads get("R#site") from the registry on Sepolia -- through your
       wallet's provider when one is injected here and on Sepolia, else a
       public RPC;
    2. fetches the served entrypoint, https://C.raw.icp0.io/site/R/;
    3. B: sha256(served) == the record's bundleHash;
    4. D: walks the record's commit to the site entrypoint through the
       canister's get_object query, checking every object's SHA-1 against
       its id, and compares that blob to the served bytes -- so nothing the
       canister says is taken on its word;
    5. E: scans the page for references the browser would not enforce
       (a port of the canister's site::unverifiable_subresource);
  and only when all pass offers to run the checked bytes in place.

  Check A of tools/verify.mjs (the X-Ic-Git-Commit header) is not readable
  from another origin -- the boundary node does not expose it -- and D
  subsumes it: the served bytes ARE the attested commit's entrypoint.

  Query string: ?repo=R [&run=1 to run as soon as verified]. Nothing else
  is taken from a link: the registry, the rpc and the canister are what
  the check trusts, and the record is keyed by repo name alone, so a
  canister chosen by a link could replay the public commit, pass every
  check, and then receive everything the running page asks of its base.
-->

  :root { --fg:#1c1c1c; --muted:#6b6b6b; --bg:#fafaf8; --line:#e2e0da; --ok:#1a7f37; --bad:#b3261e; --field:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e4dd; --muted:#9a978f; --bg:#161615; --line:#2c2b28; --ok:#4cc38a; --bad:#f2786d; --field:#1f1e1c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width:40rem; margin:0 auto; padding:2.5rem 1rem; }
  h1 { font-size:1.1rem; margin:0 0 .2rem; }
  p { margin:.3rem 0; }
  .muted { color:var(--muted); }
  code, .mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.86em; }
  form { display:flex; gap:.5rem; margin:1.4rem 0 .4rem; }
  input { font:inherit; padding:.4rem .6rem; border:1px solid var(--line); border-radius:6px; background:var(--field); color:var(--fg); min-width:0; }
  form > input { flex:1; }
  button, a.button { font:inherit; padding:.4rem .9rem; border:1px solid var(--line); border-radius:6px; background:var(--field); color:var(--fg); cursor:pointer; text-decoration:none; }
  button:hover, a.button:hover { border-color:var(--muted); }
  button.go { border-color:var(--ok); color:var(--ok); }
  details { font-size:.88rem; }
  details label { display:grid; grid-template-columns:5.5rem 1fr; gap:.5rem; align-items:center; margin:.35rem 0; }
  details input { font-size:.85rem; }
  ul { list-style:none; padding:0; margin:1rem 0; }
  li { padding:.45rem 0; border-top:1px solid var(--line); display:grid; grid-template-columns:3.2rem 1fr; }
  li .d { grid-column:2; color:var(--muted); font-size:.85rem; overflow-wrap:anywhere; }
  .pass { color:var(--ok); font-weight:600; } .fail { color:var(--bad); font-weight:600; }
  .verdict { font-weight:600; margin:1rem 0 .6rem; }
  .actions { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
</style>
</head>

  <p class="muted">Checks a site against its registry record on Sepolia, then runs exactly the bytes it checked.</p>
  <form id="f">
    <input id="repo" placeholder="repo, e.g. ic-vote" required autocomplete="off" spellcheck="false">
    <button>verify</button>
  </form>
  <details>
    <summary class="muted">settings</summary>
    <label>canister <input id="canister" class="mono" spellcheck="false"></label>
    <label>registry <input id="registry" class="mono" spellcheck="false"></label>
    <label>rpc <input id="rpc" class="mono" spellcheck="false"></label>

    out.bytes = served;

    const h = await digest('SHA-256', served);
    check('B', h === out.record.bundleHash, 'sha256 of the served page is the recorded bundleHash', h === out.record.bundleHash ? '' : 'served page hashes to ' + h);

    let path = 'index.html';
    try {
      if (site instanceof Error) throw site;
      if (!site[0]) throw new Error('the canister reports no site for ' + o.repo);
      const e = await entrypoint(o, out.record.commit, site[0][0]);
      path = e.path;
      const same = equal(e.bytes, served);
      check('D', same, 'the served page is ' + path + ' at the recorded commit', same ? 'every object on the way checked against its SHA-1' : 'the attested file differs from what was served');
    } catch (e) {
      check('D', false, 'the served page is the recorded commit\'s entrypoint', e.message);
    }
    out.path = path;

    // Read as HTML whatever the entrypoint is named: run() hands the bytes
    // to the HTML parser, which never looks at the name, so a .json root
    // holding markup is not skipped. An XML name is the one exception,
    // refused as at publish: a browser reads that page as XML, which the
    // walk does not follow, and a record from before the guard may name one.
    const why = unverifiableSubresource(/\.(svg|xhtml)$/i.test(path) ? path : 'index.html', served);
    check('E', why === null, 'everything the page loads is inline or SRI-pinned', why || '');

    out.verified = checks.every(c => c.ok);
    // What an extension pins; the loader does not need it. Check E made the
    // same walk, so a page that verifies is one this pins.
    if (out.verified) {
      try { out.policy = await derivePolicy(served, url); } catch (e) { out.policyError = e.message; }
    }
    return out;
  }

  return { verify, derivePolicy, readCanisterState, DEFAULTS };
})();
// === end core ===
</script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const q = new URLSearchParams(location.search);
  // Only the repo comes from the query string (see the header): the
  // registry, the rpc and the canister start at the defaults and change
  // only by hand.
  for (const k of ['canister', 'registry', 'rpc']) $(k).value = Verifier.DEFAULTS[k];
  $('repo').value = q.get('repo') || '';
  for (const k of ['registry', 'rpc']) $(k).value = Verifier.DEFAULTS[k];

  // Run the checked bytes, not a second fetch: the page replaces this one.
  // Two changes, neither loosening a check: a <base> so its relative URLs
  // reach the canister (the check refuses pages that set their own), and
  // crossorigin="anonymous" on integrity-pinned tags that lack it -- from
  // here those files are cross-origin, and the browser enforces SRI across
  // origins only in CORS mode, blocking the file otherwise. The page runs on
  // this page's origin, so its storage and any origin-bound sign-in differ
  // from the live site's, and a page that picks hosts from location (rather
  // than document.baseURI) sees this origin, not the canister's.
  //
  // The crossorigin edit is textual, so it is proven before it runs: the
  // edited page must parse to the checked page's DOM with crossorigin set on
  // exactly the integrity-pinned elements and nothing else. A match inside
  // script text, a comment or an attribute value changes the parse, and
  // then nothing runs.
  function withCrossorigin(src) {
    const parse = s => new DOMParser().parseFromString(s, 'text/html');
    const want = parse(src);
    for (const el of want.querySelectorAll('link[integrity], script[integrity]')) {
      if (!el.hasAttribute('crossorigin')) el.setAttribute('crossorigin', 'anonymous');
    }
    // Appended last among the attributes, where setAttribute puts it.
    const out = src.replace(/<(script|link)\b[^>]*>/gi, tag =>
      /\sintegrity\s*=/i.test(tag) && !/\scrossorigin\b/i.test(tag) ? tag.replace(/\/?>$/, ' crossorigin="anonymous"$&') : tag);
    // The whole document, not just <html>: a comment before it is a child
    // of the document.
    const ser = d => new XMLSerializer().serializeToString(d);
    if (ser(parse(out)) !== ser(want)) {
      throw new Error('could not mark this page\'s pinned files crossorigin without changing anything else, so it was not run; open the live site instead');
    }
    return out;
  }
  function run(r) {
    let html = withCrossorigin(new TextDecoder().decode(r.bytes));
    // After any leading comments and doctype (anything before the doctype
    // would put the page in quirks mode), before everything else: the parser
    // opens html and head for it and merges the page's own <html> attributes.
    const lead = /^(?:\s|\x3c!--[\s\S]*?-->)*(?:<!doctype[^>]*>)?/i.exec(html)[0].length;
    html = html.slice(0, lead) + '<base href="' + esc(r.url) + '">' + html.slice(lead);
    document.open(); document.write(html); document.close();
  }

  function show(r) {
    const at = r.record && new Date(r.record.updatedAt * 1000);
    const rec = r.record && r.record.present
      ? '<p class="muted"><span class="mono">' + esc(r.key) + '</span> at commit <span class="mono">' + esc(r.record.commit.slice(0, 12)) + '</span>, recorded ' + esc(isNaN(at) ? 'at ' + r.record.updatedAt : at.toISOString().slice(0, 16).replace('T', ' ') + ' UTC') + ', read via ' + esc(r.via) + (r.note ? ' (' + esc(r.note) + ')' : '') + '</p>'
      : '';
    const rows = r.checks.map(c => '<li><span class="' + (c.ok ? 'pass">PASS' : 'fail">FAIL') + '</span><span>' + esc(c.label) + '</span>' + (c.detail ? '<span class="d">' + esc(c.detail) + '</span>' : '') + '</li>').join('');
    $('out').innerHTML = rec + '<ul>' + rows + '</ul>' +
      '<p class="verdict ' + (r.verified ? 'pass">VERIFIED' : 'fail">NOT VERIFIED') + '</p>' +
      '<div class="actions">' + (r.verified ? '<button class="go" id="run">run it</button>' : '') +
      '<a class="button" href="' + esc(r.url) + '">open the live site</a>' +
      '<span class="muted">' + (r.verified ? 'the live site is fetched again, so this check does not cover it' : '') + '</span></div>';
    if (r.verified) $('run').onclick = () => start(r);
  }

  // Run, or keep the report and say why not.
  function start(r) {
    try { run(r); } catch (e) {
      show(r);
      $('out').insertAdjacentHTML('beforeend', '<p class="fail">' + esc(e.message || e) + '</p>');
      $('run').remove();
    }
  }

  // Only the newest request may show or run its result; an earlier, slower
  // one must not replace it (and its "run it" with another repo's bytes).
  let latest = 0;
  async function go(autorun) {
    const repo = $('repo').value.trim();
    if (!repo) return;
    const me = ++latest;
    $('out').innerHTML = '<p class="muted">checking ' + esc(repo) + '&hellip;</p>';
    // A cleared setting falls back to its default rather than overriding it.
    const opts = { repo, provider: window.ethereum || null };
    for (const k of ['canister', 'registry', 'rpc']) { const v = $(k).value.trim(); if (v) opts[k] = v; }
    try {
      const r = await Verifier.verify(opts);
      if (me !== latest) return;
      if (autorun && r.verified) return start(r);
      show(r);
    } catch (e) {
      if (me === latest) $('out').innerHTML = '<p class="fail">' + esc(e.message || e) + '</p>';
    }
  }

  $('f').onsubmit = e => { e.preventDefault(); go(false); };
  if (q.get('repo')) go(q.get('run') === '1');
})();
</script>
</body>
</html>
